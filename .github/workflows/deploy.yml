# Deploy on merge to main (docs/DEPLOY-AWS.md): every test (test.yml), then the database, the secrets, the API's
# certificate, the API and the runners (CDK, infra/github-app) and the API's DNS record. Nobody runs anything by hand.
# The API's host is ONE setting, infra/github-app/cdk.json domainName; no step here names it.
#
# The dashboard is hosted on Vercel (docs/DEPLOY-VERCEL.md), which builds it from this repository by itself: the AWS
# account cannot create CloudFront resources until AWS verifies it. The AWS dashboard (stack fenvix-<env>-dashboard:
# its us-east-1 certificate, S3 + CloudFront, the upload, its DNS record) stays in the code behind ONE switch, the
# repository variable FENVIX_DASHBOARD_ON_AWS: unset or anything but "true" (the default) skips steps 6 and 10, leaves
# the dashboard stack out of the CDK app (CDK setting dashboardOnAws) and leaves console.<zone> in Cloudflare alone.
#
# AWS access: OpenID Connect, no stored AWS key. The AWS role trusts exactly the token GitHub issues to a job of this
# file running on the branch main of this repository (sub = repo:Mircoguidetti@17613795/fenvix-app@1434576189:ref:
# refs/heads/main, repository_id, job_workflow_ref = .../deploy.yml@refs/heads/main): that is what makes "only main
# can deploy" true, enforced by AWS, with no GitHub environment (the repository is private on GitHub Free,
# where environments' secrets and branch rules do not exist). GitHub holds no secret for this workflow: every value the
# founder provides is in AWS SSM Parameter Store (/fenvix/prod/bootstrap/*), read by the step that needs it.
#
# Keep it that way (infra/github-app/test/workflows.test.ts checks every point):
#   - triggers: push to main and workflow_dispatch only (never pull_request_target, workflow_run, issue_comment, ...);
#   - no other workflow of the repository has `id-token: write`;
#   - the deploy job runs only when github.ref is refs/heads/main.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    # Roll back (G-1706, docs/DEPLOY-AWS.md "Roll back"): Run workflow on main with an earlier commit of main. The
    # workflow file, the OIDC trust and the tests stay main's; only the code deployed is that commit's.
    inputs:
      rollback_to:
        description: "Roll back: the full commit SHA of an earlier commit of main to deploy (empty: main as it is)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# One deploy at a time; a newer push to main waits for the running one instead of cancelling it half way. A "Run
# workflow" started on another branch deploys nothing (the deploy job is skipped) and is kept out of the deploy group,
# so it can never cancel or replace a pending deploy of main (R-024).
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'deploy-production' || format('not-main-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: "22"
  AWS_REGION: eu-west-1
  AWS_ACCOUNT: "865859654353"
  DEPLOY_ROLE: arn:aws:iam::865859654353:role/fenvix-github-deployer

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  deploy:
    name: Deploy to production
    needs: test
    # Only main deploys. AWS enforces it too: the role trusts the token of a job on refs/heads/main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # No GitHub environment: the repository is private on GitHub Free (no environment secrets or branch rules there).
    permissions:
      contents: read
      id-token: write # OpenID Connect token for AWS (main of this file only): no AWS key is stored anywhere
    env:
      FENVIX_ENV: prod
      # The one switch of the AWS dashboard (see the top of this file): "true" or "false", never empty.
      FENVIX_DASHBOARD_ON_AWS: ${{ vars.FENVIX_DASHBOARD_ON_AWS == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      # Roll back: only a commit that is on main (never a branch, a tag or a pull request's head).
      - name: 0. Roll back to an earlier commit of main (only with the rollback_to input)
        if: inputs.rollback_to != ''
        env:
          ROLLBACK_TO: ${{ inputs.rollback_to }}
        run: |
          [[ "$ROLLBACK_TO" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::rollback_to must be a full 40-character commit SHA"; exit 1; }
          git merge-base --is-ancestor "$ROLLBACK_TO" "$GITHUB_SHA" || { echo "::error::$ROLLBACK_TO is not an earlier commit of main"; exit 1; }
          git checkout --quiet --detach "$ROLLBACK_TO"
          echo "::notice::Rolling back: deploying $ROLLBACK_TO (main is $GITHUB_SHA); the database keeps its schema (migrations only add)."
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            github-app/package-lock.json
            infra/github-app/package-lock.json
            deploy/package-lock.json
      - name: Install
        run: |
          npm ci --no-audit --no-fund
          (cd github-app && npm ci --no-audit --no-fund)
          (cd infra/github-app && npm ci --no-audit --no-fund)
          (cd deploy && npm ci --no-audit --no-fund)

      - name: AWS credentials (OpenID Connect; the role trusts this repository's branch main only)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200
          mask-aws-account-id: false

      # Steps 1-3, 5, 6, 7c and 9 read the founder's values they need from SSM Parameter Store
      # (/fenvix/prod/bootstrap/*) themselves and mask them before any use (deploy/lib/bootstrap.mjs).
      - name: 1. Check the one-time setup
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          [ "$account" = "$AWS_ACCOUNT" ] || { echo "::error::signed in to AWS account $account, expected $AWS_ACCOUNT"; exit 1; }
          node deploy/cli.mjs preflight

      # Not on a roll back: migrations only go forward and only add (an earlier commit runs on the newer schema).
      - name: 2. Database migrations
        if: inputs.rollback_to == ''
        run: node deploy/cli.mjs migrate

      - name: 3. Database roles (passwords generated here, stored in SSM only)
        run: node deploy/cli.mjs db-roles

      - name: 4. Generated secrets (SSM, never printed)
        run: node deploy/cli.mjs secrets

      - name: 5. GitHub App (configured last, in SSM; deployed without it until then)
        run: node deploy/cli.mjs github-app

      - name: 6. Dashboard certificate (us-east-1, for CloudFront; only with FENVIX_DASHBOARD_ON_AWS)
        if: env.FENVIX_DASHBOARD_ON_AWS == 'true'
        env:
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: node deploy/cli.mjs dashboard-certificate --wait-minutes 30

      - name: 7. Keep the cache machine's image (a deploy never replaces it because Ubuntu published a newer one)
        run: |
          id="$(aws cloudformation describe-stacks --stack-name "fenvix-$FENVIX_ENV-github-app" \
                --query "Stacks[0].Outputs[?OutputKey=='CacheAmiId'].OutputValue | [0]" --output text 2>/dev/null || true)"
          if [ -z "$id" ] || [ "$id" = "None" ]; then
            id="$(aws ssm get-parameter --name /aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id --query Parameter.Value --output text)"
          fi
          echo "cache machine image: $id"
          echo "FENVIX_CACHE_AMI_ID=$id" >> "$GITHUB_ENV"

      # Only what a failed FIRST create left: a stack in ROLLBACK_COMPLETE (CloudFormation cannot update it), and the
      # dashboard's retained bucket once no stack holds it and only if it is empty (deploy/lib/recover.mjs). Any other
      # state is left to CDK; a left-over bucket with files stops the deploy, deleting nothing.
      - name: 7b. Clear a failed first create (a stack in ROLLBACK_COMPLETE, its empty retained bucket)
        run: node deploy/cli.mjs recover-failed-creates

      # Before CDK, so CloudFormation never waits for a DNS record: requested once, its validation CNAME put in
      # Cloudflare (or, without a Cloudflare token, listed in the summary and waited for), then waited for. Not issued
      # in time: the run stops here with the record to add, nothing else changed; the next run finds it and goes on.
      - name: 7c. API certificate (the stack's region; validated before CDK)
        env:
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: node deploy/cli.mjs api-certificate --wait-minutes 20

      # FENVIX_DASHBOARD_ON_AWS (job env) is the CDK setting dashboardOnAws: off, `--all` is the API stack only.
      - name: 8. API, runners (and the AWS dashboard hosting only with FENVIX_DASHBOARD_ON_AWS) (CDK)
        working-directory: infra/github-app
        env:
          FENVIX_ALARM_EMAIL: ${{ vars.FENVIX_ALARM_EMAIL }}
        run: |
          # The API's certificate is step 7c's (issued): the stack uses it by ARN and never waits for DNS.
          [ -n "${FENVIX_API_CERTIFICATE_ARN:-}" ] || { echo "::error::no API certificate from step 7c"; exit 1; }
          npx --no-install cdk deploy --all --require-approval never --progress events --outputs-file cdk-outputs.json \
            -c "githubAppId=$FENVIX_CDK_GITHUB_APP_ID" -c "githubAppSlug=$FENVIX_CDK_GITHUB_APP_SLUG" \
            -c "githubClientId=$FENVIX_CDK_GITHUB_CLIENT_ID"

      # Without a Cloudflare token: lists the record, waits for it in public DNS, and stops with it if it is not there.
      - name: 9. DNS records (Cloudflare)
        env:
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: node deploy/cli.mjs dns --outputs infra/github-app/cdk-outputs.json --wait-minutes 20

      - name: 10. Dashboard on AWS (build, upload, refresh the cache; only with FENVIX_DASHBOARD_ON_AWS)
        if: env.FENVIX_DASHBOARD_ON_AWS == 'true'
        run: |
          # VITE_SUPABASE_ANON_KEY (public, checked and masked) comes from step 1. The API's URL is the stack's own
          # output (https://<cdk.json domainName>/v1), never a literal here.
          out=infra/github-app/cdk-outputs.json
          VITE_API_URL="$(node -p "require('./$out')['fenvix-$FENVIX_ENV-github-app'].DashboardApiUrl")"
          export VITE_API_URL VITE_SUPABASE_URL="$SUPABASE_URL"
          npm run build
          bucket="$(node -p "require('./$out')['fenvix-$FENVIX_ENV-dashboard'].DashboardBucket")"
          dist="$(node -p "require('./$out')['fenvix-$FENVIX_ENV-dashboard'].DistributionId")"
          # Hashed files are kept for a year; old ones stay, so a page loaded before this deploy keeps working.
          aws s3 sync dist/assets "s3://$bucket/assets" --cache-control "public,max-age=31536000,immutable" --only-show-errors
          aws s3 sync dist "s3://$bucket" --exclude "assets/*" --delete --cache-control "no-cache" --only-show-errors
          aws cloudfront create-invalidation --distribution-id "$dist" --paths "/*" --query Invalidation.Id --output text

      # The machine image of our machines: built when its recipe changed (the engine pin is part of it), and WAITED FOR:
      # a failed build or a failed image test (the engine and the agent must start on it) fails the deploy (G-1713,
      # G-1745). Without an engine pin (cdk.json engineVersion/engineUrl/engineSha256) no image is built: the pool
      # starts no machine and jobs wait, and the summary says why (fail closed, G-0186).
      - name: 11. Machine image (built when its recipe changed; waited for)
        timeout-minutes: 90
        run: |
          out=infra/github-app/cdk-outputs.json
          arn="$(node -p "require('./$out')['fenvix-$FENVIX_ENV-github-app'].ImagePipelineArn")"
          ver="$(node -p "require('./$out')['fenvix-$FENVIX_ENV-github-app'].RunnerImageVersion")"
          engine="$(node -p "require('./$out')['fenvix-$FENVIX_ENV-github-app'].EngineVersion")"
          if [ "$engine" = "none" ]; then
            echo "::warning::no engine pinned in cdk.json: no machine image is built, our machines start nothing" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status() { aws imagebuilder list-image-pipeline-images --image-pipeline-arn "$arn" \
                     --query "imageSummaryList[?starts_with(version, '$ver/')].state.status" --output text; }
          states="$(status)"
          if ! printf '%s' "$states" | grep -Eq 'AVAILABLE|PENDING|CREATING|BUILDING|TESTING|DISTRIBUTING|INTEGRATING'; then
            aws imagebuilder start-image-pipeline-execution --image-pipeline-arn "$arn" --query imageBuildVersionArn --output text
            echo "machine image $ver (engine $engine): build started" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          for _ in $(seq 1 85); do
            states="$(status)"
            case "$states" in
              *AVAILABLE*) echo "machine image $ver (engine $engine): available" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0 ;;
              *FAILED*|*CANCELLED*) printf '%s' "$states" | grep -Eq 'PENDING|CREATING|BUILDING|TESTING|DISTRIBUTING|INTEGRATING' || {
                echo "::error::machine image $ver failed ($states): see the Image Builder log; the previous image stays in use"; exit 1; } ;;
            esac
            sleep 60
          done
          echo "::error::machine image $ver not available after 85 minutes ($states)"; exit 1

      - name: 12. Check the deployed hosts
        run: node deploy/cli.mjs smoke --minutes 10
