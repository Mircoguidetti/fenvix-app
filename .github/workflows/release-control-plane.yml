# Builds the control-plane image (control-plane/Dockerfile) and publishes it, saved as an archive, to the FENVIX artifacts
# bucket: a private S3 bucket of the founder's AWS account, created by the stack in infra/. The server loads it with
# `docker load` after checking its SHA-256 against the stack setting controlPlaneSha256 (infra/lib/artifacts.ts); it never
# pulls from a registry, so no registry login lives on the server.
#
# Run it by hand: Actions > release-control-plane > Run workflow (ref = commit, tag or branch of this repository). The job
# summary prints the two stack settings to copy: controlPlaneVersion and controlPlaneSha256 (docs/deploy-checklist.md).
#
# AWS: short-lived OIDC credentials of a role that can only write control-plane/ in the bucket. Repository secrets
# (Settings > Secrets and variables > Actions), values from the stack outputs:
#   AWS_PUBLISH_ROLE_ARN  output PublishControlPlaneRoleArn
#   ARTIFACTS_BUCKET      output ArtifactsBucketName
# The role trusts this repository on the branches of the stack setting controlPlaneRepoBranches (default: main). The log
# never shows the account id, the role or the bucket (secrets and masks; AWS errors are printed with them blanked out).
name: release-control-plane

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag or branch of this repository to build
        required: true
        type: string
      arch:
        description: CPU of the server (t3.medium and c6i.large are x86_64, c7g.large is aarch64)
        required: true
        type: choice
        options: [x86_64, aarch64]
        default: x86_64
      publish:
        description: Upload to the artifacts bucket (off = build and print the SHA-256 only)
        required: true
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-control-plane
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  # Image name the server expects after docker load (infra/lib/artifacts.ts, CONTROL_PLANE_IMAGE_REPO).
  IMAGE_REPO: fenvix-control-plane

jobs:
  build:
    if: github.repository == 'Mircoguidetti/fenvix-app'
    # aarch64 needs GitHub's arm64 runners (available to this repository only on some plans).
    runs-on: ${{ inputs.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      ARCH: ${{ inputs.arch }}
    steps:
      - name: Check the inputs
        env:
          REF: ${{ inputs.ref }}
        run: |
          [[ "$REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]] || { echo "::error::ref must be a commit, a tag or a branch name"; exit 1; }
          [[ "$ARCH" = x86_64 || "$ARCH" = aarch64 ]] || { echo "::error::arch must be x86_64 or aarch64"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Build the image and save it as an archive
        id: meta
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "$ARCH" ] || { echo "::error::runner is $(uname -m), asked for $ARCH"; exit 1; }
          commit="$(git rev-parse HEAD)"
          version="$(date -u +%Y%m%d)-${commit:0:12}-r${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          image="$IMAGE_REPO:$version"
          docker build --pull --label "org.opencontainers.image.revision=$commit" -t "$image" control-plane
          [ "$(docker image inspect -f '{{.Architecture}}' "$image")" = "$( [ "$ARCH" = x86_64 ] && echo amd64 || echo arm64 )" ] || { echo "::error::image architecture differs from $ARCH"; exit 1; }
          out="$RUNNER_TEMP/control-plane.tar.gz"
          docker save "$image" | gzip -n -9 > "$out"
          sha="$(sha256sum "$out" | cut -d' ' -f1)"
          {
            echo "file=$out"
            echo "version=$version"
            echo "sha256=$sha"
            echo "key=control-plane/$version/$ARCH/control-plane.tar.gz"
          } >> "$GITHUB_OUTPUT"
          echo "control plane $version ($ARCH, commit $commit): $(du -h "$out" | cut -f1), SHA-256 $sha"

      - name: Publish (OIDC, write-only role, never overwrites)
        if: inputs.publish
        env:
          ROLE_ARN: ${{ secrets.AWS_PUBLISH_ROLE_ARN }}
          BUCKET: ${{ secrets.ARTIFACTS_BUCKET }}
          FILE: ${{ steps.meta.outputs.file }}
          KEY: ${{ steps.meta.outputs.key }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha256 }}
        run: |
          set -euo pipefail
          # AWS messages can name the account and the role: print them with both blanked out.
          scrub() { sed -E 's/arn:aws[a-z-]*:[^ "]*/<arn>/g; s/[0-9]{12}/<account>/g' "$1" >&2; }
          err="$(mktemp)"
          [ -n "$ROLE_ARN" ] && [ -n "$BUCKET" ] || { echo "::error::set the repository secrets AWS_PUBLISH_ROLE_ARN and ARTIFACTS_BUCKET (stack outputs)"; exit 1; }
          [[ "$ROLE_ARN" =~ ^arn:aws:iam::([0-9]{12}):role/([A-Za-z0-9+=,.@_-]+)$ ]] || { echo "::error::AWS_PUBLISH_ROLE_ARN is not an IAM role ARN"; exit 1; }
          echo "::add-mask::${BASH_REMATCH[1]}"
          echo "::add-mask::${BASH_REMATCH[2]}"
          [[ "$KEY" =~ ^control-plane/[A-Za-z0-9._-]+/(x86_64|aarch64)/control-plane\.tar\.gz$ ]] || { echo "::error::unexpected key"; exit 1; }
          # GitHub OIDC token for AWS STS, exchanged for 15-minute credentials of the publish role.
          tok="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)"
          echo "::add-mask::$tok"
          # TEMP DEBUG (remove): identity claims of the token, not a credential
          python3 -c 'import sys,json,base64;p=sys.argv[1].split(".")[1];p+="="*(-len(p)%4);c=json.loads(base64.urlsafe_b64decode(p));print({k:c.get(k) for k in ("iss","aud","sub","repository","ref","job_workflow_ref")})' "$tok" >&2
          creds="$(aws sts assume-role-with-web-identity --region "$AWS_REGION" --role-arn "$ROLE_ARN" \
            --role-session-name "github-$GITHUB_RUN_ID" --web-identity-token "$tok" --duration-seconds 900 \
            --query Credentials --output json 2>"$err")" || { echo "::error::AWS refused the OIDC token (trust policy: repository, branch)"; scrub "$err"; exit 1; }
          for f in AccessKeyId SecretAccessKey SessionToken; do echo "::add-mask::$(jq -r ".$f" <<<"$creds")"; done
          AWS_ACCESS_KEY_ID="$(jq -r .AccessKeyId <<<"$creds")"
          AWS_SECRET_ACCESS_KEY="$(jq -r .SecretAccessKey <<<"$creds")"
          AWS_SESSION_TOKEN="$(jq -r .SessionToken <<<"$creds")"
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
          unset creds tok
          # S3 checks the upload against the SHA-256 (no corrupted copy), and --if-none-match refuses to replace a
          # version already published (a version name is never reused).
          b64="$(openssl dgst -sha256 -binary "$FILE" | base64)"
          [ "$(printf '%s' "$b64" | base64 -d | od -An -tx1 | tr -d ' \n')" = "$SHA" ] || { echo "::error::SHA-256 changed since it was computed"; exit 1; }
          aws s3api put-object --region "$AWS_REGION" --bucket "$BUCKET" --key "$KEY" --body "$FILE" \
            --checksum-sha256 "$b64" --if-none-match '*' >/dev/null 2>"$err" || { echo "::error::upload refused"; scrub "$err"; exit 1; }
          echo "uploaded $KEY"
          {
            echo "### Control-plane image published"
            echo
            echo "Stack settings for this release (infra, docs/deploy-checklist.md):"
            echo
            echo '```'
            echo "controlPlaneVersion=$VERSION"
            echo "controlPlaneSha256=$SHA"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
