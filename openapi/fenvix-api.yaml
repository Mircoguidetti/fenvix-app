openapi: 3.1.0
info:
  title: fenvix API
  version: 1.0.0
  license: { name: Proprietary, url: "https://fenvix.dev" }
  description: |
    The one API the fenvix dashboard talks to (the dashboard never reaches the database). Served by the GitHub App
    service (github-app/src/api/) on AWS Lambda behind API Gateway, at https://api.fenvix.dev/v1.

    **Source of truth.** The dashboard's typed client (src/api/schema.d.ts) is generated from this file
    (`npm run api:generate`) and src/data/types.ts re-exports these schemas: changing a field here breaks the dashboard
    build until the screens follow. The server validates requests against this file and its integration tests validate
    every response against it.

    **Dashboard operations** (tag `dashboard`) need a Supabase Auth session token (`Authorization: Bearer <access
    token>`). Operations on an organization also take `X-Fenvix-Workspace: <organization id>`; the server checks on
    every call that the person is a member of it and, where `x-fenvix-role: admin` is set, an owner or admin. Row level
    security in the database checks the same again.

    **API keys** (scripts, the CLI, coding agents, the remote MCP server): operations marked `x-fenvix-key: read` (runs,
    defects, bundles, explorations) also take `Authorization: Bearer fxk_...`, a key of one organization made on the
    API keys page (owners and admins; shown once, revocable, optional expiry). With a key, X-Fenvix-Workspace may be
    left out (it is the key's organization; another one is 404). Operations marked `x-fenvix-key: replay` need a key
    with the replay scope. Every other operation refuses a key (403). Requests are limited per person and per key
    (`rate_limited`, 429 with Retry-After).

    **Remote MCP server**: `POST /v1/mcp` (and https://mcp.fenvix.dev once its DNS record exists) speaks the Model
    Context Protocol (JSON-RPC 2.0, streamable HTTP, JSON responses) with an API key: tools list_runs, list_defects,
    get_defect, pull_bundle, request_replay, get_replay. Agents install nothing.

    **Runner operations** (tag `runner`) are called by fenvix machines with their per-machine credential
    (docs/data-contract.md, "What the runner sends").

    Conventions: JSON, camelCase, times ISO 8601 UTC, durations in milliseconds unless the name says otherwise, shares
    from 0 to 1. Errors are `{ "error": { "code", "message", "field"? } }` with a message a person can read.
servers:
  - url: https://api.fenvix.dev/v1
security:
  - session: []
tags:
  - name: dashboard
    description: Called by the dashboard with the signed-in person's Supabase session token.
  - name: runner
    description: Called by fenvix machines with their per-machine credential.
  - name: mcp
    description: The remote MCP server, for coding agents, with an API key.
  - name: app
    description: The GitHub App's own endpoints (GitHub calls them, or the browser on its way back from GitHub). Outside /v1.
  - name: proposed
    description: |
      Agreed for the dashboard (docs/data-contract.md, "Live test view"), not served yet. The server serves only
      operations tagged `dashboard` and needs a handler for each, so an operation moves from `proposed` to `dashboard`
      in the same change that adds its handler (github-app/src/api/server.ts). Until then the dashboard builds against
      it with test fixtures and shows the API's error when it is called.

paths:
  # ------------------------------------------------------------------ the person and their organizations
  /me:
    get:
      tags: [dashboard]
      operationId: getMe
      summary: The signed-in person and their organizations
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        default: { $ref: "#/components/responses/Error" }
  /organizations:
    get:
      tags: [dashboard]
      operationId: listOrganizations
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Organization" } } } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [dashboard]
      operationId: createOrganization
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationName" } } } }
      responses:
        "201":
          description: Created; the person is its owner
          content: { application/json: { schema: { type: object, required: [organization], properties: { organization: { $ref: "#/components/schemas/Organization" } } } } }
        default: { $ref: "#/components/responses/Error" }
  /organization:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      tags: [dashboard]
      operationId: getOrganization
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationDetail" } } } }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [dashboard]
      operationId: renameOrganization
      x-fenvix-role: admin
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationName" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Organization" } } } }
        default: { $ref: "#/components/responses/Error" }
  /organization/leave:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      tags: [dashboard]
      operationId: leaveOrganization
      responses:
        "204": { description: Left }
        default: { $ref: "#/components/responses/Error" }
  /organization/members:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      tags: [dashboard]
      operationId: listMembers
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, required: [items, limit], properties: { items: { type: array, items: { $ref: "#/components/schemas/Member" } }, limit: { type: integer } } } } }
        default: { $ref: "#/components/responses/Error" }
  /organization/members/{userId}:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { name: userId, in: path, required: true, schema: { type: string, format: uuid } }]
    put:
      tags: [dashboard]
      operationId: changeMemberRole
      x-fenvix-role: admin
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [role], additionalProperties: false, properties: { role: { $ref: "#/components/schemas/OrgRole" } } } } } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, required: [userId, role], properties: { userId: { type: string }, role: { $ref: "#/components/schemas/OrgRole" } } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [dashboard]
      operationId: removeMember
      x-fenvix-role: admin
      responses:
        "204": { description: Removed }
        default: { $ref: "#/components/responses/Error" }
  /organization/transfer-ownership:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      tags: [dashboard]
      operationId: transferOwnership
      description: "Owners only (G-2325). The member becomes an owner and the caller an admin, in one step, confirmed by typing the organization's name; the audit log records organization.ownership_transferred."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [userId, confirmName], additionalProperties: false, properties: { userId: { type: string, format: uuid }, confirmName: { type: string, maxLength: 64 } } } } } }
      responses:
        "200":
          description: Transferred
          content: { application/json: { schema: { type: object, required: [userId, role, yourRole], properties: { userId: { type: string }, role: { $ref: "#/components/schemas/OrgRole" }, yourRole: { $ref: "#/components/schemas/OrgRole" } } } } }
        default: { $ref: "#/components/responses/Error" }
  /organization/invitations:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      tags: [dashboard]
      operationId: listInvitations
      x-fenvix-role: admin
      responses:
        "200":
          description: Pending invitations
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Invitation" } } } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [dashboard]
      operationId: createInvitation
      x-fenvix-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], additionalProperties: false, properties: { email: { type: string, maxLength: 254 }, role: { $ref: "#/components/schemas/InviteRole" } } }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/CreatedInvitation" } } } }
        default: { $ref: "#/components/responses/Error" }
  /organization/invitations/{id}/revoke:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [dashboard]
      operationId: revokeInvitation
      x-fenvix-role: admin
      responses:
        "200": { description: Revoked, content: { application/json: { schema: { $ref: "#/components/schemas/Invitation" } } } }
        default: { $ref: "#/components/responses/Error" }
  /invitations/accept:
    post:
      tags: [dashboard]
      operationId: acceptInvitation
      description: "A pending invitation sent to another address than the signed-in person's verified one answers 403 `invitation_other_email` (G-2329); every other refusal (unknown, used, expired, revoked) is the same 404."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string, maxLength: 128 } } } } } }
      responses:
        "200":
          description: Joined (or already a member)
          content: { application/json: { schema: { type: object, required: [organization], properties: { organization: { $ref: "#/components/schemas/Organization" } } } } }
        default: { $ref: "#/components/responses/Error" }
  /settings:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      tags: [dashboard]
      operationId: getSettings
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [dashboard]
      operationId: saveSettings
      x-fenvix-role: admin
      description: Name, e-mail notices and region (US or EU). The region decides where the organization's machines run from the next job on.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ overview, trial, projects, runs
  /overview:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      tags: [dashboard]
      operationId: getOverview
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Overview" } } } }
        default: { $ref: "#/components/responses/Error" }
  /projects:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      tags: [dashboard]
      operationId: listProjects
      x-fenvix-key: read
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ProjectRow" } } } } } }
        default: { $ref: "#/components/responses/Error" }
  /projects/{projectId}:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [dashboard]
      operationId: getProject
      x-fenvix-key: read
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectRow" } } } }
        default: { $ref: "#/components/responses/Error" }
  /projects/{projectId}/settings:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ProjectId" }]
    put:
      tags: [dashboard]
      operationId: saveProjectSettings
      x-fenvix-role: admin
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProjectSettings" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        default: { $ref: "#/components/responses/Error" }
  /projects/{projectId}/runs:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [dashboard]
      operationId: listRuns
      x-fenvix-key: read
      description: Newest first. With `since`, every run since then (no paging; at most 20,000).
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [all, pr, default], default: all } }
        - { name: status, in: query, schema: { type: string, enum: [all, passed, failed], default: all } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: pullRequest, in: query, description: "Only the runs of this pull request.", schema: { type: integer, minimum: 1 } }
        - { name: branch, in: query, description: "Only the runs of this branch.", schema: { type: string, maxLength: 255 } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RunPage" } } } }
        default: { $ref: "#/components/responses/Error" }
  /projects/{projectId}/skip-share:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [dashboard]
      operationId: getSkipShareSeries
      parameters: [{ name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }]
      responses:
        "200":
          description: Median share of test time skipped with proof per day
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/SkipSharePoint" } } } } } }
        default: { $ref: "#/components/responses/Error" }
  /projects/{projectId}/explorations:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [dashboard]
      operationId: listExplorations
      x-fenvix-key: read
      responses:
        "200":
          description: Nights of exploration, newest first
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Exploration" } } } } } }
        default: { $ref: "#/components/responses/Error" }
  /projects/{projectId}/audit:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [dashboard]
      operationId: getAudit
      summary: Audit reruns of skipped tests (Skip with proof)
      parameters: [{ name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AuditSummary" } } } }
        default: { $ref: "#/components/responses/Error" }
  /projects/{projectId}/setup-change:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [dashboard]
      operationId: getSetupChange
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SetupChange" } } } }
        default: { $ref: "#/components/responses/Error" }
  /activity:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      tags: [dashboard]
      operationId: listActivity
      parameters:
        - { name: projectId, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 8 } }
      responses:
        "200":
          description: Newest first
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ActivityItem" } } } } } }
        default: { $ref: "#/components/responses/Error" }
  /runs/{runId}:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/RunId" }]
    get:
      tags: [dashboard]
      operationId: getRun
      x-fenvix-key: read
      description: |
        Live view: while `run.status` is `running` the dashboard asks again every 3 to 5 seconds, only while the page
        is open and visible, sending the last `ETag` as `If-None-Match`; nothing changed answers 304 with no body.
      parameters: [{ name: If-None-Match, in: header, schema: { type: string } }]
      responses:
        "200":
          description: OK
          headers: { ETag: { schema: { type: string } }, Cache-Control: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: "#/components/schemas/RunDetail" } } }
        "304": { description: Not modified since the ETag given }
        default: { $ref: "#/components/responses/Error" }
  /runs/{runId}/tests:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/RunId" }]
    get:
      tags: [dashboard]
      operationId: listTestResults
      x-fenvix-key: read
      parameters:
        - { name: outcome, in: query, schema: { type: string, enum: [all, passed, failed, skipped_with_proof], default: all } }
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TestPage" } } } }
        default: { $ref: "#/components/responses/Error" }
  /runs/{runId}/files:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/RunId" }]
    get:
      tags: [dashboard]
      operationId: listRunFiles
      x-fenvix-key: read
      responses:
        "200":
          description: The run's tests by file
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/RunFile" } } } } } }
        default: { $ref: "#/components/responses/Error" }
  /runs/{runId}/tests/live:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/RunId" }]
    get:
      tags: [dashboard]
      operationId: listLiveTests
      x-fenvix-key: read
      description: |
        The live view's tests: the tests of the run that finished after `afterSeq`, in the order they finished (by `seq`),
        at most 2,000 per answer. The dashboard asks with the last `lastSeq` it got, every 3 to 5 seconds while the run
        is running and the page is visible. While the run runs these come from the runner's progress records
        (`finished`); once its results are applied, from the results (the same tests, `seq` kept where known).
      parameters:
        - { name: afterSeq, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LiveTests" } } } }
        default: { $ref: "#/components/responses/Error" }
  /runs/{runId}/stop:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/RunId" }]
    post:
      tags: [dashboard]
      operationId: stopRun
      x-fenvix-role: admin
      description: |
        Stops a running run on fenvix's machines (the dispatcher cancels the GitHub job and terminates its machine).
        `now`: at once. `first_failure`: armed; the run is stopped when its first test fails (at once if one already
        failed). `off`: disarms `first_failure`. 409 when the run is not running.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [when], properties: { when: { type: string, enum: [now, first_failure, off] } } } } }
      responses:
        "202": { description: "Accepted: the run with its stop request", content: { application/json: { schema: { $ref: "#/components/schemas/RunDetail" } } } }
        default: { $ref: "#/components/responses/Error" }
  /runs/{runId}/replays:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/RunId" }]
    get:
      tags: [dashboard]
      operationId: listReplays
      x-fenvix-key: read
      responses:
        "200":
          description: The run's replays, newest first
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Replay" } } } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [dashboard]
      operationId: replayTest
      x-fenvix-role: admin
      description: |
        Replays one test of the run on fenvix's machines: the run's commit, seed and order (the defect's minimal order
        when the test is a flaky defect), `runs` times (10). A test already queued or running for this run is answered
        with that replay.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [testId], properties: { testId: { type: string, maxLength: 2000 } } } } }
      responses:
        "202": { description: Accepted, content: { application/json: { schema: { $ref: "#/components/schemas/Replay" } } } }
        default: { $ref: "#/components/responses/Error" }
  /replays/{replayId}:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { name: replayId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [dashboard]
      operationId: getReplay
      x-fenvix-key: read
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Replay" } } } }
        default: { $ref: "#/components/responses/Error" }
  /receipts/{receiptId}:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { name: receiptId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [dashboard]
      operationId: getSkipReceipt
      x-fenvix-key: read
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SkipReceipt" } } } }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ defects
  /defects:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      tags: [dashboard]
      operationId: listDefects
      x-fenvix-key: read
      description: Newest first, at most `limit` (1,000) from `offset`; `total` is how many match.
      parameters: [{ $ref: "#/components/parameters/DefectProject" }, { $ref: "#/components/parameters/DefectState" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses:
        "200":
          description: Newest first
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Defect" } }, total: { type: integer } } } } }
        default: { $ref: "#/components/responses/Error" }
  /defect-families:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      tags: [dashboard]
      operationId: listDefectFamilies
      x-fenvix-key: read
      parameters: [{ $ref: "#/components/parameters/DefectProject" }, { $ref: "#/components/parameters/DefectState" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses:
        "200":
          description: Defects grouped by cause
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/DefectFamily" } } } } } }
        default: { $ref: "#/components/responses/Error" }
  /defects/{defectId}:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { name: defectId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [dashboard]
      operationId: getDefect
      x-fenvix-key: read
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Defect" } } } }
        default: { $ref: "#/components/responses/Error" }

  /defects/{defectId}/state:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/DefectId" }]
    post:
      tags: [dashboard]
      operationId: setDefectState
      description: Fix, mute or reopen a defect (any member; not with an API key). A fixed defect seen again in a later run opens again.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DefectStateChange" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Defect" } } } }
        default: { $ref: "#/components/responses/Error" }
  /defects/{defectId}/bundle/download:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/DefectId" }]
    get:
      tags: [dashboard]
      operationId: downloadDefectBundle
      x-fenvix-key: read
      description: "The defect's replay bundle as the runner uploaded it: a .tar.gz of bundle.json, order.txt and the run's traces. `curl -H 'Authorization: Bearer $FENVIX_API_KEY' .../bundle | tar -xz`"
      responses:
        "200":
          description: The bundle
          headers: { x-fenvix-bundle-sha256: { schema: { type: string } } }
          content: { application/gzip: { schema: { type: string, format: binary } } }
        default: { $ref: "#/components/responses/Error" }
  /defects/{defectId}/replays:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/DefectId" }]
    get:
      tags: [dashboard]
      operationId: listDefectReplays
      x-fenvix-key: read
      responses:
        "200":
          description: Newest first
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Replay" } } } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [dashboard]
      operationId: requestDefectReplay
      x-fenvix-key: replay
      description: "Replays the defect on a fenvix machine (`fenvix replay` of its bundle, 10 times) at a commit (default: the newest commit that saw it). One replay in flight per defect; at most 10 a day. The result comes back to the defect: 10 of 10 passing on a later commit marks it fixed."
      requestBody: { required: false, content: { application/json: { schema: { $ref: "#/components/schemas/ReplayRequest" } } } }
      responses:
        "202": { description: Requested, content: { application/json: { schema: { $ref: "#/components/schemas/Replay" } } } }
        default: { $ref: "#/components/responses/Error" }
  /projects/{projectId}/exploration-settings:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ProjectId" }]
    put:
      tags: [dashboard]
      operationId: saveExplorationSettings
      x-fenvix-role: admin
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ExplorationSettings" } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ExplorationSettings" } } } }
        default: { $ref: "#/components/responses/Error" }
  /projects/{projectId}/exploration-jobs:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [dashboard]
      operationId: listExplorationJobs
      x-fenvix-key: read
      responses:
        "200":
          description: Newest first (50)
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ExplorationJob" } } } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [dashboard]
      operationId: requestExploration
      x-fenvix-role: admin
      description: An exploration now (or for a pull request's commit), under the project's time cap and seed budget. One in flight per project.
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false, properties: { commitSha: { type: string, pattern: "^[0-9a-f]{40}$" }, testIds: { type: array, maxItems: 500, items: { type: string, maxLength: 2000 } } } } } } }
      responses:
        "202": { description: Requested, content: { application/json: { schema: { $ref: "#/components/schemas/ExplorationJob" } } } }
        default: { $ref: "#/components/responses/Error" }
  /projects/{projectId}/skip/resume:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ProjectId" }]
    post:
      tags: [dashboard]
      operationId: resumeSkip
      x-fenvix-role: admin
      description: Skip with proof again after fenvix paused it (an audit rerun found a wrong skip).
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Project" } } } }
        default: { $ref: "#/components/responses/Error" }
  /projects/{projectId}/disconnect:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/ProjectId" }]
    post:
      tags: [dashboard]
      operationId: deleteProject
      x-fenvix-role: admin
      description: Disconnects the repository and deletes the project with its runs, results, receipts, defects, bundles, replays and explorations. No machine runs its jobs until its setup is asked for again.
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /organization/delete:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      tags: [dashboard]
      operationId: deleteOrganization
      x-fenvix-role: admin
      description: An owner deletes the organization (typing its name) with everything in it. Its GitHub installations are unlinked; usage events are kept for billing.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [confirmName], properties: { confirmName: { type: string, maxLength: 64 } } } } } }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /organization/export:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      tags: [dashboard]
      operationId: exportOrganization
      x-fenvix-role: admin
      description: The organization's data as JSON (projects, the newest 5,000 runs, defects with their history, explorations). Per-test results and receipts are read run by run (listTestResults, getSkipReceipt).
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/OrganizationExport" } } } }
        default: { $ref: "#/components/responses/Error" }
  /failures:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      tags: [dashboard]
      operationId: listFailures
      x-fenvix-key: read
      description: "The coding agent's question (MCP failures_for): the failing and flaky tests of a pull request (its newest commit; with projectId), a commit or a run, each with the error, a log excerpt, the defect, the first divergent event, the replay command, and whether it is new or a known failure. status: running while one of the runs runs, none when no run was found."
      parameters:
        - { name: projectId, in: query, schema: { type: string, format: uuid } }
        - { name: pullRequest, in: query, schema: { type: integer, minimum: 1 } }
        - { name: commitSha, in: query, schema: { type: string, pattern: "^[0-9a-f]{40}$" } }
        - { name: runId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Failures" } } } }
        default: { $ref: "#/components/responses/Error" }
  /runs/{runId}/tests/log:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/RunId" }]
    get:
      tags: [dashboard]
      operationId: getTestLog
      x-fenvix-key: read
      description: "The full output of one test of the run, as the runner captured it (at most 64 KB; null when the runner sent none)."
      parameters: [{ name: testId, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 2000 } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [runId, testId, outcome, output, failure]
                properties:
                  runId: { type: string }
                  testId: { type: string }
                  outcome: { $ref: "#/components/schemas/TestOutcome" }
                  output: { type: [string, "null"] }
                  failure: { oneOf: [{ $ref: "#/components/schemas/TestFailure" }, { type: "null" }] }
        default: { $ref: "#/components/responses/Error" }
  /organization/audit-log:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      tags: [dashboard]
      operationId: listAuditEvents
      x-fenvix-role: admin
      description: "Who changed what, newest first: members and roles, invitations, the organization's name and region, GitHub linked or unlinked, project settings and disconnections, API keys, defects' states."
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } } } } } }
        default: { $ref: "#/components/responses/Error" }
  /me/delete:
    post:
      tags: [dashboard]
      operationId: deleteMe
      description: Deletes the signed-in person's account. Refused while they are the only owner of an organization with other members; organizations where they are the only member are deleted with it.
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }
  /api-keys:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      tags: [dashboard]
      operationId: listApiKeys
      x-fenvix-role: admin
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/ApiKey" } } } } } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [dashboard]
      operationId: createApiKey
      x-fenvix-role: admin
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ApiKeyRequest" } } } }
      responses:
        "201": { description: "Created; key is shown this once", content: { application/json: { schema: { $ref: "#/components/schemas/ApiKeyCreated" } } } }
        default: { $ref: "#/components/responses/Error" }
  /api-keys/{keyId}/revoke:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { name: keyId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [dashboard]
      operationId: revokeApiKey
      x-fenvix-role: admin
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ApiKey" } } } }
        default: { $ref: "#/components/responses/Error" }
  /github/installations/{installationId}/unlink:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { name: installationId, in: path, required: true, schema: { type: integer, minimum: 1 } }]
    post:
      tags: [dashboard]
      operationId: unlinkInstallation
      x-fenvix-role: admin
      description: Disconnects a GitHub account (installation) from the organization. Its projects and their data are deleted; the App stays installed on GitHub until it is uninstalled there.
      responses:
        "204": { description: Unlinked }
        default: { $ref: "#/components/responses/Error" }
  /mcp:
    post:
      tags: [mcp]
      operationId: mcp
      security: [{ apiKey: [] }]
      description: "The remote MCP server (Model Context Protocol 2025-06-18, streamable HTTP with JSON responses): initialize, tools/list, tools/call (list_runs, list_defects, get_defect, pull_bundle, request_replay, get_replay), ping. One JSON-RPC message per request."
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: A JSON-RPC response, content: { application/json: { schema: { type: object } } } }
        "202": { description: A notification was accepted }
  /defects/{defectId}/occurrences:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { name: defectId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [dashboard]
      operationId: listDefectOccurrences
      x-fenvix-key: read
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Offset" }]
      description: Every run where this defect's test failed with this defect, newest first (the defect's memory across runs).
      responses:
        "200":
          description: Newest first
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/DefectOccurrence" } }, total: { type: integer } } } } }
        default: { $ref: "#/components/responses/Error" }
  /defects/{defectId}/bundle:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { name: defectId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [dashboard]
      operationId: getDefectBundle
      x-fenvix-key: read
      description: A short-lived link to the defect's replay bundle (a .tar.gz of bundle.json, order.txt and the traces). 404 when no bundle is stored.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DefectBundle" } } } }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ usage and billing
  /usage/months:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      tags: [dashboard]
      operationId: listUsageMonths
      responses:
        "200":
          description: Months with runs, newest first (YYYY-MM)
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Month" } } } } } }
        default: { $ref: "#/components/responses/Error" }
  /usage/{month}:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/MonthPath" }]
    get:
      tags: [dashboard]
      operationId: getUsage
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UsageReport" } } } }
        default: { $ref: "#/components/responses/Error" }
  /usage/{month}/csv:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { $ref: "#/components/parameters/MonthPath" }]
    get:
      tags: [dashboard]
      operationId: exportUsage
      responses:
        "200":
          description: One row per project; in every row test_minutes_ran + minutes_saved + other_step_minutes = github_equivalent_minutes
          headers: { Content-Disposition: { schema: { type: string } } }
          content: { text/csv: { schema: { type: string } } }
        default: { $ref: "#/components/responses/Error" }
  /plans:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      tags: [dashboard]
      operationId: listPlans
      responses:
        "200":
          description: Plans and add-ons, with the organization's current ones marked
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Plan" } } } } } }
        default: { $ref: "#/components/responses/Error" }
  /billing:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      tags: [dashboard]
      operationId: getBilling
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BillingOverview" } } } }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ GitHub
  /github:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      tags: [dashboard]
      operationId: getGitHubConnection
      summary: The organization's GitHub App installations and their status
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/GitHubConnection" } } } }
        default: { $ref: "#/components/responses/Error" }
  /github/install-link:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    post:
      tags: [dashboard]
      operationId: createInstallLink
      x-fenvix-role: admin
      description: |
        Where to send the browser to install the fenvix GitHub App for this organization. The link carries a signed
        state (organization, person, one hour, usable once). After the installation GitHub sends the browser to the
        service's /github/setup, which checks the state, the GitHub user's OAuth code, that this GitHub user sees the
        installation and administers its account (the account itself, or an active admin of the GitHub organization),
        and redirects to the dashboard's `/projects/connect?github=confirm&installation=<id>&account=<login>#completion=<code>`.
        It does not link: the dashboard completes the link with completeGitHubInstall, as the signed-in person, who must
        be the person the state names. Other answers: `?github=error&reason=<reason>` (reasons expired, incomplete,
        oauth, not_yours, github_not_admin, not_admin, other_organization, removed, used, github, error), or
        `?github=requested` when an organization owner on GitHub must approve the request first.
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string, format: uri } } } } }
        default: { $ref: "#/components/responses/Error" }
  /github/installations/complete:
    post:
      tags: [dashboard]
      operationId: completeGitHubInstall
      summary: Links the GitHub installation of a completed install link to the organization that asked for it
      description: |
        The last step of connecting GitHub. `completion` is the one-time code /github/setup put after `#` in its redirect
        (valid 10 minutes, usable once). The installation is linked to the organization named by the install link, only
        if the signed-in person is the one who asked for that link and is still an owner or admin there. Every refusal of
        the code itself (unknown, used, expired, another person's) is the same 404, so a code cannot be probed.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [completion], properties: { completion: { type: string, minLength: 1, maxLength: 128 } } } } } }
      responses:
        "200":
          description: Linked (or already linked to this organization)
          content:
            application/json:
              schema:
                type: object
                required: [organizationId, installationId, account]
                properties:
                  organizationId: { type: string, format: uuid }
                  installationId: { type: integer, minimum: 1 }
                  account: { type: string, description: The GitHub account's login }
        default: { $ref: "#/components/responses/Error" }
  /github/repositories:
    parameters: [{ $ref: "#/components/parameters/Workspace" }]
    get:
      tags: [dashboard]
      operationId: listGitHubRepositories
      summary: Repositories of every installation of the organization, with their onboarding state
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/GitHubRepository" } } } } } }
        default: { $ref: "#/components/responses/Error" }
  /github/repositories/{repositoryId}/setup-pull-request:
    parameters: [{ $ref: "#/components/parameters/Workspace" }, { name: repositoryId, in: path, required: true, description: GitHub's repository id, schema: { type: integer, minimum: 1 } }]
    post:
      tags: [dashboard]
      operationId: openSetupPullRequest
      x-fenvix-role: admin
      description: |
        Asks the App to open (or find) the setup pull request of one repository. The work is queued; the answer is the
        repository as it is now (its `onboardingState` moves to `pr_open`, or says why no pull request was opened, when
        the work is done: ask GET /github/repositories again).
      responses:
        "202": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/GitHubRepository" } } } }
        default: { $ref: "#/components/responses/Error" }

  # ------------------------------------------------------------------ what fenvix machines send
  /runner/summaries:
    post:
      tags: [runner]
      operationId: postRunnerSummary
      security: [{ runner: [] }]
      description: The run summary at the end of the test step (unchanged, docs/data-contract.md). Queued; 202.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RunnerSummaryEnvelope" } } } }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        default: { $ref: "#/components/responses/Error" }
  /runner/progress:
    post:
      tags: [runner]
      operationId: postRunnerProgress
      security: [{ runner: [] }]
      description: |
        Progress while the job runs: at the start of each phase and at most every 3 seconds while tests run (and once
        more when the test step ends). Written at once to the run (no queue), so the dashboard's live view sees it on
        its next poll. A progress record older than the stored one (`seq`) is ignored.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RunnerProgress" } } } }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        default: { $ref: "#/components/responses/Error" }
  /runner/results:
    post:
      tags: [runner]
      operationId: postRunnerResults
      security: [{ runner: [] }]
      description: |
        Per-test outcomes, skip receipts, defect bundles and audit reruns of the job, in numbered chunks (at most 5,000
        tests or 2,000 receipts per chunk, 6 MB). Chunk 0 carries `chunks`, the total. Stored and queued; the App
        applies them to the run once the run exists (when the job completes). Sending a chunk again replaces it.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RunnerResults" } } } }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        default: { $ref: "#/components/responses/Error" }
  /runner/warmups:
    post:
      tags: [runner]
      operationId: postRunnerWarmup
      security: [{ runner: [] }]
      description: |
        A warm-up machine's two reports (docs/data-contract.md "Warm-up runs"): `started` when the machine starts the
        runner's warm-up executor; `finished` at the end with the outcome and, when the test step ran, the runner's
        summary.json. Only the warm-up machine's own credential is accepted (it names the warm-up), and that credential
        is refused on every other runner operation: a warm-up is never a run (no run row, no check run, no comment, never
        billed). Written at once; a late or repeated report is answered 202 like the first.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RunnerWarmupReport" } } } }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        default: { $ref: "#/components/responses/Error" }
  /runner/explorations:
    post:
      tags: [runner]
      operationId: postRunnerExploration
      security: [{ runner: [] }]
      description: >-
        One night of exploration (the engine's explore.json, summarised) and the defect bundles it produced. Only from a
        credential that names the repository alone: a CI job's per-job credential (it names a run) gets 403. At most one
        new exploration per project and UTC day is stored (the same one sent again is updated), and a project keeps its
        newest 90 nights.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RunnerExploration" } } } }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        default: { $ref: "#/components/responses/Error" }

  /runner/bundles:
    post:
      tags: [runner]
      operationId: postRunnerBundle
      security: [{ runner: [] }]
      description: "A defect's replay bundle from the job's own machine: base64 of a .tar.gz (bundle.json, order.txt, the run's traces), at most 4 MB. Send it after the results chunk that names the defect, or before: the defect is made either way. 503 with Retry-After while the job's run is not recorded yet."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RunnerBundle" } } } }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        default: { $ref: "#/components/responses/Error" }
  /runner/replays:
    post:
      tags: [runner]
      operationId: postRunnerReplay
      security: [{ runner: [] }]
      description: "A replay machine's two reports (its own task credential only): started, then finished with passed, failed or error, runs, fails and the fingerprint. 10 of 10 passing on a later commit than the defect's last sighting marks the defect fixed."
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RunnerReplayReport" } } } }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        default: { $ref: "#/components/responses/Error" }
  /runner/replays/{replayId}/bundle:
    get:
      tags: [runner]
      operationId: getRunnerReplayBundle
      security: [{ runner: [] }]
      parameters: [{ name: replayId, in: path, required: true, schema: { type: string, format: uuid } }]
      description: The bundle the replay machine replays (its own replay only).
      responses:
        "200": { description: The bundle, content: { application/gzip: { schema: { type: string, format: binary } } } }
        default: { $ref: "#/components/responses/Error" }
  /healthz:
    servers: [{ url: https://api.fenvix.dev }]
    get:
      tags: [app]
      operationId: healthz
      security: []
      responses:
        "200": { description: The service answers, content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { type: boolean } } } } } }
  /webhooks/github:
    servers: [{ url: https://api.fenvix.dev }]
    post:
      tags: [app]
      operationId: githubWebhook
      security: []
      description: "GitHub's webhook deliveries, signed with the webhook secret (X-Hub-Signature-256 over the raw body). Events handled: installation, installation_repositories, installation_target, repository, push, pull_request, workflow_job, workflow_run, check_run, check_suite, github_app_authorization; ping answers pong; any other event is recorded and answered 202 ignored."
      parameters:
        - { name: X-GitHub-Event, in: header, required: true, schema: { type: string } }
        - { name: X-GitHub-Delivery, in: header, required: true, schema: { type: string, maxLength: 100 } }
        - { name: X-Hub-Signature-256, in: header, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: ping, content: { application/json: { schema: { type: object } } } }
        "202": { description: Accepted (handled in the background) or ignored, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /github/setup:
    servers: [{ url: https://api.fenvix.dev }]
    get:
      tags: [app]
      operationId: githubSetup
      security: []
      description: "Where GitHub sends the browser after an installation (OAuth callback). Always a 303 to the dashboard's /projects/connect with `github=confirm&installation=<id>&account=<login>#completion=<code>`, `github=requested`, or `github=error&reason=<reason>`, reason one of expired, incomplete, oauth, not_yours, github_not_admin, not_admin, other_organization, removed, used, github, error (docs/data-contract.md, \"Linking an installation\")."
      parameters:
        - { name: installation_id, in: query, schema: { type: integer } }
        - { name: setup_action, in: query, schema: { type: string, enum: [install, update, request] } }
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "200": { description: "Never: every answer is the 303 redirect" }
        "303": { description: To the dashboard }

components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      bearerFormat: Supabase Auth access token (ES256, verified against the project's JWKS)
    runner:
      type: http
      scheme: bearer
      bearerFormat: the machine's summary credential (github-app/src/runners/credentials.ts)
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: "an organization's API key, fxk_ followed by 40 characters"

  parameters:
    Workspace:
      name: X-Fenvix-Workspace
      in: header
      required: true
      description: The organization the request is for. The person must be a member of it.
      schema: { type: string, format: uuid }
    ProjectId: { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    RunId: { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 25 } }
    MonthPath: { name: month, in: path, required: true, schema: { $ref: "#/components/schemas/Month" } }
    DefectProject: { name: projectId, in: query, schema: { type: string, format: uuid } }
    DefectState: { name: state, in: query, schema: { type: string, enum: [open, fixed, muted, all], default: open } }
    DefectId: { name: defectId, in: path, required: true, schema: { type: string, format: uuid } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 1000 } }
    Offset: { name: offset, in: query, schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 } }

  responses:
    Error:
      description: An error a person can read
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Accepted:
      description: Accepted
      content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { type: boolean } } } } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: "unauthenticated, forbidden, not_found, validation_failed, conflict, rate_limited, unavailable, github_not_configured (503: the GitHub App is not configured on this server yet; install link, completing an installation and setup pull requests answer it), internal" }
            message: { type: string }
            field: { type: string }

    # ---------------------------------------------------------------- organizations
    OrgRole: { type: string, enum: [owner, admin, member] }
    InviteRole: { type: string, enum: [admin, member] }
    Region: { type: string, enum: [us, eu], description: "Where the organization's jobs run: us (United States) or eu (European Union)." }
    OrganizationName:
      type: object
      required: [name]
      additionalProperties: false
      properties: { name: { type: string, minLength: 1, maxLength: 512 } }
    Organization:
      type: object
      required: [id, name, role, nameConfirmed]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: "#/components/schemas/OrgRole" }
        nameConfirmed: { type: boolean }
    OrganizationDetail:
      allOf:
        - $ref: "#/components/schemas/Organization"
        - type: object
          required: [region, members, limits]
          properties:
            region: { $ref: "#/components/schemas/Region" }
            members: { type: integer }
            limits:
              type: object
              required: [maxMembers, invitationsPerDay]
              properties: { maxMembers: { type: integer }, invitationsPerDay: { type: integer } }
    Me:
      type: object
      required: [user, organizations]
      properties:
        user:
          type: object
          required: [id, email, name]
          properties: { id: { type: string, format: uuid }, email: { type: string }, name: { type: string } }
        organizations: { type: array, items: { $ref: "#/components/schemas/Organization" } }
    Member:
      type: object
      required: [userId, name, email, role, joinedAt, you]
      properties:
        userId: { type: string }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/OrgRole" }
        joinedAt: { type: [string, "null"], format: date-time }
        you: { type: boolean }
    Invitation:
      type: object
      required: [id, email, role, createdAt, expiresAt]
      properties:
        id: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/InviteRole" }
        createdAt: { type: [string, "null"], format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
    CreatedInvitation:
      type: object
      required: [invitation, link]
      properties:
        invitation: { $ref: "#/components/schemas/Invitation" }
        link: { type: string, description: "Holds the token after #. Shown once." }
    Settings:
      type: object
      required: [workspaceName, emailNotices, region]
      additionalProperties: false
      properties:
        workspaceName: { type: string, minLength: 1, maxLength: 512 }
        emailNotices: { type: boolean, description: "E-mails about usage, new defects and account notices." }
        region: { $ref: "#/components/schemas/Region" }

    # ---------------------------------------------------------------- projects and runs
    Language: { type: string, enum: [python, node, go] }
    TestRunner: { type: string, enum: [pytest, unittest, django, nose2, ward, vitest, jest, mocha, "node:test", ava, tap, bun, playwright, cypress, go test], description: "Every runner the service knows (G-0616, G-1750). fenvix runs pytest, Vitest and Jest; a project with another runner is recognised and its setup pull request says why it is not run yet." }
    RunTrigger: { type: string, enum: [push, pull_request, merge_group, schedule, workflow_dispatch, other] }
    RunStatus: { type: string, enum: [running, passed, failed, cancelled] }
    RunMode: { type: string, enum: [enforce, shadow], description: "shadow: the trial; every test ran and the engine recorded what it would have skipped." }
    SetupState: { type: string, enum: [app_installed, pr_open, active] }
    TestOutcome: { type: string, enum: [passed, failed, skipped_with_proof] }
    MissKind: { type: string, enum: [new, failed-before, config, runtime, clock, env, data, code] }
    Month: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" }
    SetupPullRequest:
      type: object
      required: [number, url, state]
      properties:
        number: { type: integer }
        url: { type: string }
        state: { type: string, enum: [open, merged, closed] }
    Baseline:
      type: object
      required: [medianTimeToGreenS, medianJobMinutes, runsSampled, from, to]
      properties:
        medianTimeToGreenS: { type: number }
        medianJobMinutes: { type: number }
        runsSampled: { type: integer }
        from: { type: string }
        to: { type: string }
    ProjectSettings:
      type: object
      required: [skipWithProof, commentOnPullRequests, nightlyExploration, testCommand]
      additionalProperties: false
      properties:
        skipWithProof: { type: boolean }
        commentOnPullRequests: { type: boolean }
        nightlyExploration: { type: boolean }
        testCommand: { type: string, maxLength: 500, description: "The test command the runner wraps; empty: the job's own command." }
    Project:
      type: object
      required: [id, fullName, language, testRunner, defaultBranch, installationId, repositoryId, setupState, setupPullRequest, connectedAt, baseline, settings, warmCache]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string, description: "owner/name on GitHub" }
        language: { $ref: "#/components/schemas/Language" }
        testRunner: { $ref: "#/components/schemas/TestRunner" }
        defaultBranch: { type: string }
        installationId: { type: integer }
        repositoryId: { type: [integer, "null"], description: "GitHub's repository id, when the App knows it" }
        setupState: { $ref: "#/components/schemas/SetupState" }
        setupPullRequest: { oneOf: [{ $ref: "#/components/schemas/SetupPullRequest" }, { type: "null" }] }
        connectedAt: { type: string, format: date-time }
        baseline: { oneOf: [{ $ref: "#/components/schemas/Baseline" }, { type: "null" }] }
        settings: { $ref: "#/components/schemas/ProjectSettings" }
        skipPaused:
          oneOf: [{ type: object, required: [at, reason], properties: { at: { type: string, format: date-time }, reason: { type: string } } }, { type: "null" }]
          description: "fenvix paused skip with proof after an audit rerun found a wrong skip (resumeSkip); null: not paused"
        exploration: { $ref: "#/components/schemas/ExplorationSettings" }
        warmCache: { $ref: "#/components/schemas/WarmCache" }
    WarmupStatus:
      type: string
      enum: [pending, dispatched, running, succeeded, failed, unsupported, covered, superseded, cancelled]
      description: |
        pending: waiting (grace period, a free machine, the organization's other warm-up, the repository's daily cap);
        dispatched: a machine was requested; running: the machine runs the test job; succeeded / failed / unsupported:
        how it ended (unsupported: the job cannot run outside GitHub Actions); covered: the customer's own run of that
        commit filled the cache; superseded: a newer default-branch commit came first; cancelled: the installation or the
        repository went away, or no machine started for it.
    Warmup:
      type: object
      required: [status, commitSha, detail, updatedAt]
      properties:
        status: { $ref: "#/components/schemas/WarmupStatus" }
        commitSha: { type: string, pattern: "^[0-9a-f]{40}$" }
        detail: { type: string, description: "Why it waits, or how it ended, in words a person can act on." }
        updatedAt: { type: string, format: date-time }
    WarmCache:
      type: object
      description: |
        The shared cache of the repository's default branch. `state`: warm (the cache holds the proofs of `commitSha`),
        warming (a warm-up is pending or running), cold (no proofs yet and no warm-up in flight).
      required: [state, commitSha, warmAt, source, warmup]
      properties:
        state: { type: string, enum: [warm, warming, cold] }
        commitSha: { type: [string, "null"], description: "Warm since this default-branch commit (40 hex); null: never warmed" }
        warmAt: { type: [string, "null"], format: date-time }
        source: { type: [string, "null"], enum: [warmup, run, null], description: "warmup: one of fenvix's warm-up runs; run: the customer's own run on the default branch" }
        warmup: { oneOf: [{ $ref: "#/components/schemas/Warmup" }, { type: "null" }], description: "The repository's latest warm-up" }
    MinuteBreakdown:
      type: object
      description: "ran + skipped + other = total, each rounded with the largest-remainder rule."
      required: [ran, skipped, other, total]
      properties: { ran: { type: number }, skipped: { type: number }, other: { type: number }, total: { type: number } }
    ProjectRow:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required: [runsThisMonth, medianSkipShare, openDefects, minutesThisMonth, minutesSavedThisMonth, lastRunAt, lastRunStatus]
          properties:
            runsThisMonth: { type: integer }
            medianSkipShare: { type: [number, "null"] }
            openDefects: { type: integer }
            minutesThisMonth: { $ref: "#/components/schemas/MinuteBreakdown" }
            minutesSavedThisMonth: { type: number }
            lastRunAt: { type: [string, "null"], format: date-time }
            lastRunStatus: { oneOf: [{ $ref: "#/components/schemas/RunStatus" }, { type: "null" }] }
    RunTests:
      type: object
      required: [total, ran, passed, failed, skippedWithProof, flakyDefects]
      properties:
        total: { type: integer }
        ran: { type: integer }
        passed: { type: integer }
        failed: { type: integer }
        skippedWithProof: { type: integer }
        flakyDefects: { type: integer }
    RunProgress:
      type: object
      description: The runner's latest progress record while the run is running (docs/data-contract.md, "Run progress").
      required: [phase, testsTotal, testsDone, passed, failed, skippedWithProof, currentTest, elapsedMs, updatedAt]
      properties:
        phase: { type: string, enum: [setup, collecting, testing, reporting] }
        testsTotal: { type: [integer, "null"], description: "null until collection ends" }
        testsDone: { type: integer }
        passed: { type: integer }
        failed: { type: integer }
        skippedWithProof: { type: integer }
        currentTest: { type: [string, "null"] }
        elapsedMs: { type: integer }
        updatedAt: { type: string, format: date-time }
        workers:
          type: array
          description: "Proposed (P-049): the parallel workers and what each runs now; empty or absent when the runner did not say."
          items: { $ref: "#/components/schemas/RunWorker" }
    RunWorker:
      type: object
      required: [id, currentTest, testsDone, state]
      properties:
        id: { type: string, description: "The worker's name as the runner gives it, e.g. gw0" }
        currentTest: { type: [string, "null"] }
        testsDone: { type: integer }
        state: { type: string, enum: [running, idle, done] }
    RunStop:
      type: object
      description: "A stop asked for on a running run (POST /runs/{runId}/stop). armed: first_failure waits for a failure; requested: sent to the machines; done: the job was cancelled; failed: it could not be (detail says why)."
      required: [when, state, requestedAt, requestedBy, detail]
      properties:
        when: { type: string, enum: [now, first_failure] }
        state: { type: string, enum: [armed, requested, done, failed] }
        requestedAt: { type: string, format: date-time }
        requestedBy: { type: string, description: "The person's name" }
        detail: { type: string }
    RunJob:
      type: object
      description: "The GitHub job behind a run: a repository with several test jobs or a matrix has one run per job."
      required: [workflow, name, matrix]
      properties:
        workflow: { type: string }
        name: { type: string }
        matrix: { type: [string, "null"], description: "The matrix values, e.g. python 3.12" }
    MissDetail:
      type: object
      required: [kind, detail, tests]
      properties: { kind: { $ref: "#/components/schemas/MissKind" }, detail: { type: string }, tests: { type: integer } }
    Run:
      type: object
      required: [id, projectId, number, engineRunId, commitSha, commitMessage, branch, pullRequest, trigger, status, mode, pushedAt, startedAt, finishedAt,
        durationMs, tests, testTimeMs, skipShare, minutesSaved, otherStepMinutes, githubEquivalentMinutes, engineVersion, seed, skipMisses, missDetails,
        wouldSkipTests, wouldSaveMs, audit, region, progress]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        number: { type: integer }
        language: { oneOf: [{ $ref: "#/components/schemas/Language" }, { type: "null" }], description: "The run's own language, from its summary (G-1755: a repository with Python and TypeScript test jobs). Null: the project's." }
        testRunner: { oneOf: [{ $ref: "#/components/schemas/TestRunner" }, { type: "null" }], description: "The run's own test runner, from its summary. Null: the project's." }
        engineRunId: { type: [string, "null"] }
        commitSha: { type: string }
        commitMessage: { type: string }
        branch: { type: string }
        pullRequest: { type: [integer, "null"] }
        trigger: { $ref: "#/components/schemas/RunTrigger" }
        status: { $ref: "#/components/schemas/RunStatus" }
        mode: { $ref: "#/components/schemas/RunMode" }
        pushedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        durationMs: { type: integer }
        tests: { $ref: "#/components/schemas/RunTests" }
        testTimeMs:
          type: object
          required: [ran, skipped]
          properties: { ran: { type: integer }, skipped: { type: integer } }
        skipShare: { type: number, description: "Share of test time skipped with proof." }
        minutesSaved: { type: number, description: "Test minutes skipped with proof only." }
        otherStepMinutes: { type: number, description: "Checkout, install, build: still run on fenvix." }
        githubEquivalentMinutes: { type: number, description: "The same job on a GitHub-hosted runner: tests run + skipped + other steps (the baseline minutes of run units)." }
        engineVersion: { type: string }
        seed: { type: [integer, "null"] }
        skipMisses:
          type: object
          description: Tests that ran because they could not be reused, by reason.
          propertyNames: { $ref: "#/components/schemas/MissKind" }
          additionalProperties: { type: integer }
        missDetails: { type: array, items: { $ref: "#/components/schemas/MissDetail" } }
        wouldSkipTests: { type: integer, description: "Shadow mode: tests fenvix would have skipped with proof (they ran)." }
        wouldSaveMs: { type: integer, description: "Shadow mode: their test time." }
        audit:
          type: object
          description: "Audit reruns: skipped tests the engine ran anyway; wrongSkips are those that failed (expected 0)."
          required: [rerun, wrongSkips]
          properties: { rerun: { type: integer }, wrongSkips: { type: integer } }
        region: { oneOf: [{ $ref: "#/components/schemas/Region" }, { type: "null" }] }
        progress: { oneOf: [{ $ref: "#/components/schemas/RunProgress" }, { type: "null" }] }
        stop: { oneOf: [{ $ref: "#/components/schemas/RunStop" }, { type: "null" }], description: "Proposed (P-049)" }
        job: { oneOf: [{ $ref: "#/components/schemas/RunJob" }, { type: "null" }], description: "Proposed (P-049)" }
        githubRunId: { type: [integer, "null"], description: "Proposed (P-049): GitHub's workflow run id, for the link to the job" }
        githubJobId: { type: [integer, "null"], description: "Proposed (P-049): GitHub's job id" }
    RunPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Run" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    RunDetail:
      type: object
      required: [run, project]
      properties:
        run: { $ref: "#/components/schemas/Run" }
        project: { $ref: "#/components/schemas/Project" }
    SkipSharePoint:
      type: object
      required: [at, value, runs]
      properties: { at: { type: string, format: date-time }, value: { type: number }, runs: { type: integer } }
    RunFile:
      type: object
      required: [file, tests, ran, skipped, failed]
      properties: { file: { type: string }, tests: { type: integer }, ran: { type: integer }, skipped: { type: integer }, failed: { type: integer } }
    Exploration:
      type: object
      required: [id, projectId, startedAt, finishedAt, commitSha, branch, seeds, runs, collected, seconds, flakyFailing, alwaysFailing, notReproduced, newDefectIds, familiesByPolluter, seedsLog]
      properties:
        id: { type: string }
        projectId: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        commitSha: { type: string }
        branch: { type: string }
        seeds: { type: integer }
        runs: { type: integer }
        collected: { type: integer }
        seconds: { type: number }
        flakyFailing: { type: array, items: { type: string } }
        alwaysFailing: { type: array, items: { type: string } }
        notReproduced: { type: array, items: { type: string } }
        newDefectIds: { type: array, items: { type: string } }
        familiesByPolluter:
          type: array
          items: { type: object, required: [key, tests], properties: { key: { type: string }, tests: { type: integer } } }
        seedsLog:
          type: array
          items: { type: object, required: [seed, seconds, failing], properties: { seed: { type: integer }, seconds: { type: number }, failing: { type: integer } } }
    ActivityItem:
      type: object
      required: [id, at, kind, title, detail, projectId, to]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        kind: { type: string, enum: [run_green, run_failed, defect_reproduced, exploration, setup_pr] }
        title: { type: string }
        detail: { type: string }
        projectId: { type: string }
        to: { type: string, description: "A dashboard path" }
    TestFailure:
      type: object
      required: [kind, phase, exceptionType, message, location, defectId]
      properties:
        kind: { type: string, enum: [real, flaky_defect] }
        phase: { type: string }
        exceptionType: { type: string }
        message: { type: string }
        location: { type: string }
        defectId: { type: [string, "null"] }
    TestResult:
      type: object
      required: [runId, testId, file, outcome, durationMs, failure, receiptId]
      properties:
        runId: { type: string }
        testId: { type: string }
        file: { type: string }
        outcome: { $ref: "#/components/schemas/TestOutcome" }
        durationMs: { type: integer }
        failure: { oneOf: [{ $ref: "#/components/schemas/TestFailure" }, { type: "null" }] }
        receiptId: { type: [string, "null"] }
        worker: { type: [string, "null"], description: "Proposed (P-049): the worker that ran it" }
        seq: { type: [integer, "null"], description: "Proposed (P-049): its place in the order tests finished" }
        finishedAt: { type: [string, "null"], format: date-time, description: "Proposed (P-049)" }
    LiveTests:
      type: object
      required: [items, lastSeq, status]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TestResult" } }
        lastSeq: { type: integer, description: "The highest seq given so far: ask again with afterSeq = lastSeq" }
        status: { $ref: "#/components/schemas/RunStatus" }
    Replay:
      type: object
      description: |
        One test of a run replayed on fenvix's machines, `runs` times with the run's seed and order. verdict, once done:
        reproduced (failed every time with an identical fingerprint), flaky (failed some of the times), passed (never failed).
      required: [id, runId, testId, defectId, state, verdict, runs, done, fails, identicalFingerprint, command, detail, requestedAt, startedAt, finishedAt]
      properties:
        id: { type: string }
        runId: { type: [string, "null"], description: "null: a replay of a defect asked for outside a run (API key, MCP)" }
        projectId: { type: string }
        commitSha: { type: string }
        fingerprint: { type: [string, "null"] }
        requestedVia: { type: string, enum: [dashboard, api_key, mcp, pull_request] }
        testId: { type: string }
        defectId: { type: [string, "null"] }
        state: { type: string, enum: [queued, running, done, failed] }
        verdict: { type: [string, "null"], enum: [reproduced, flaky, passed, null] }
        runs: { type: integer }
        done: { type: integer }
        fails: { type: integer }
        identicalFingerprint: { type: [boolean, "null"] }
        command: { type: string, description: "The engine command the machine ran" }
        detail: { type: string, description: "For a person: what it waits for, or why it failed" }
        requestedAt: { type: string, format: date-time }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
    TestPage:
      type: object
      required: [items, total, page, pageSize, counts]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TestResult" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        counts:
          type: object
          description: Tests of the run per outcome, whatever the filter.
          required: [passed, failed, skipped_with_proof]
          properties: { passed: { type: integer }, failed: { type: integer }, skipped_with_proof: { type: integer } }
    SkipReceipt:
      type: object
      required: [id, runId, testId, cacheKey, reusedRunId, reusedEngineRunId, reusedRunNumber, reusedOutcome, fingerprint, reusedDurationMs, code, modules, filesRead, envRead, runtime, config, changedFilesProven]
      properties:
        id: { type: string }
        runId: { type: string }
        testId: { type: string }
        cacheKey: { type: string }
        reusedRunId: { type: [string, "null"] }
        reusedEngineRunId: { type: string }
        reusedRunNumber: { type: [integer, "null"] }
        reusedOutcome: { type: string, enum: [passed] }
        fingerprint: { type: string }
        reusedDurationMs: { type: integer }
        code:
          type: array
          items: { type: object, required: [path, qualname, digest], properties: { path: { type: string }, qualname: { type: string }, digest: { type: string } } }
        modules:
          type: array
          items: { type: object, required: [path, kind, digest], properties: { path: { type: string }, kind: { type: string, enum: [content, skeleton, hooks] }, digest: { type: string } } }
        filesRead:
          type: array
          items: { type: object, required: [path, dep], properties: { path: { type: string }, dep: { type: string } } }
        envRead:
          type: array
          items: { type: object, required: [name, digest], properties: { name: { type: string }, digest: { type: string } } }
        runtime:
          type: object
          required: [digest, interpreter, system, machine, libc, distributions]
          properties: { digest: { type: string }, interpreter: { type: string }, system: { type: string }, machine: { type: string }, libc: { type: string }, distributions: { type: integer } }
        config:
          type: object
          required: [digest, runner, engine, inifile, options]
          properties: { digest: { type: string }, runner: { type: string }, engine: { type: string }, inifile: { type: string }, options: { type: string } }
        changedFilesProven: { type: integer }

    # ---------------------------------------------------------------- skip with proof: audit reruns
    AuditRerun:
      type: object
      required: [runId, runNumber, testId, cacheKey, outcome, untrusted, detail, at]
      properties:
        runId: { type: string }
        runNumber: { type: integer }
        testId: { type: string }
        cacheKey: { type: string }
        outcome: { type: string, enum: [confirmed, wrong_skip] }
        untrusted: { type: boolean }
        detail: { type: string }
        at: { type: string, format: date-time }
    AuditSummary:
      type: object
      required: [from, to, runs, testsRerun, wrongSkips, expectedWrongSkips, ruleOfThreeBound, untrustedKeys, recent]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        runs: { type: integer, description: "Runs in the window that rerun at least one skipped test." }
        testsRerun: { type: integer }
        wrongSkips: { type: integer }
        expectedWrongSkips: { type: integer, enum: [0] }
        ruleOfThreeBound:
          type: [number, "null"]
          description: "With no wrong skip in n audited tests, the wrong-skip rate is below 3/n with 95% confidence (rule of three). Null when n is 0 or a wrong skip was found."
        untrustedKeys:
          type: array
          description: Cache keys the engine stopped trusting, newest first.
          items: { $ref: "#/components/schemas/AuditRerun" }
        recent: { type: array, items: { $ref: "#/components/schemas/AuditRerun" }, description: "The latest audited tests, newest first (at most 50)." }

    # ---------------------------------------------------------------- defects
    DefectCause: { type: string, enum: [polluter, state_setter, fails_alone, async_order, thread, clock, random, network, filesystem, environment, unknown] }
    Failures:
      type: object
      required: [status, runs, items]
      properties:
        status: { type: string, enum: [running, passed, failed, none] }
        runs:
          type: array
          items: { type: object, required: [id, number, status, commitSha, job], properties: { id: { type: string }, number: { type: integer }, status: { type: string }, commitSha: { type: string }, job: { type: [string, "null"] } } }
        items:
          type: array
          items:
            type: object
            required: [runId, runNumber, job, testId, kind, error, logExcerpt, defectId, divergence, replayCommand, new, known]
            properties:
              runId: { type: string }
              runNumber: { type: integer }
              job: { type: [string, "null"] }
              testId: { type: string }
              kind: { type: string, enum: [real, flaky_defect] }
              error: { type: object, required: [type, message, location], properties: { type: { type: string }, message: { type: string }, location: { type: string } } }
              logExcerpt: { type: [string, "null"], description: "the last 2,000 characters of the test's output (else the error message)" }
              defectId: { type: [string, "null"] }
              divergence: { type: [object, "null"], description: "the first divergent event (flaky tests)" }
              replayCommand: { type: [string, "null"] }
              new: { type: boolean, description: "first seen in these runs" }
              known: { type: boolean, description: "seen before (a known defect, or a test that failed before)" }
    AuditEvent:
      type: object
      required: [id, at, actor, action, target, detail]
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        actor:
          type: object
          required: [kind, id, email]
          properties: { kind: { type: string, enum: [person, api_key, fenvix] }, id: { type: [string, "null"] }, email: { type: [string, "null"] } }
        action: { type: string }
        target: { type: string }
        detail: { type: object }
    DefectStateChange:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { type: string, enum: [open, fixed, muted] }
        reason: { type: string, maxLength: 500 }
    ReplayRequest:
      type: object
      additionalProperties: false
      properties: { commitSha: { type: string, pattern: "^[0-9a-f]{40}$" } }
    ExplorationSettings:
      type: object
      additionalProperties: false
      required: [hourUtc, budgetSeconds, seeds, target]
      properties:
        hourUtc: { type: integer, minimum: 0, maximum: 23 }
        budgetSeconds: { type: integer, minimum: 60, maximum: 14400 }
        seeds: { type: integer, minimum: 1, maximum: 500 }
        target: { type: string, enum: [all, unstable], description: "unstable: only the tests of open defects and tests that failed in the last 14 days" }
    ExplorationJob:
      type: object
      required: [id, projectId, reason, status, detail, commitSha, budgetSeconds, seeds, targets, explorationId, createdAt, finishedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        reason: { type: string, enum: [nightly, pull_request, manual] }
        status: { type: string, enum: [pending, dispatched, running, finished, failed, cancelled] }
        detail: { type: string }
        commitSha: { type: [string, "null"] }
        budgetSeconds: { type: integer }
        seeds: { type: integer }
        targets: { type: array, items: { type: string } }
        explorationId: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
    ApiKey:
      type: object
      required: [id, name, prefix, scopes, createdAt, expiresAt, lastUsedAt, revokedAt]
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string, description: "the key's first 10 characters (fxk_ and 6), to recognise it" }
        scopes: { type: array, items: { type: string, enum: [read, replay] } }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        revokedAt: { type: [string, "null"], format: date-time }
    ApiKeyRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        scopes: { type: array, minItems: 1, maxItems: 2, uniqueItems: true, items: { type: string, enum: [read, replay] }, default: [read] }
        expiresInDays: { type: integer, minimum: 1, maximum: 3650 }
    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKey"
        - type: object
          required: [key]
          properties: { key: { type: string, description: "the key itself, shown this once" } }
    OrganizationExport:
      type: object
      required: [exportedAt, organization, projects, runs, defects, occurrences, explorations]
      properties:
        exportedAt: { type: string, format: date-time }
        organization: { type: object }
        projects: { type: array, items: { $ref: "#/components/schemas/Project" } }
        runs: { type: array, items: { $ref: "#/components/schemas/Run" } }
        defects: { type: array, items: { $ref: "#/components/schemas/Defect" } }
        occurrences: { type: array, items: { type: object } }
        explorations: { type: array, items: { $ref: "#/components/schemas/Exploration" } }
    RunnerBundle:
      allOf:
        - $ref: "#/components/schemas/RunnerJob"
        - type: object
          required: [testId, content]
          properties:
            testId: { type: string, maxLength: 2000 }
            fingerprint: { type: string, pattern: "^[0-9a-f]{32}$" }
            sha256: { type: string, pattern: "^[0-9a-f]{64}$", description: "of the decoded content; checked when given" }
            content: { type: string, description: "base64 of the .tar.gz, at most 4 MB decoded" }
    RunnerReplayReport:
      type: object
      required: [replayId, event]
      properties:
        replayId: { type: string, format: uuid }
        event: { type: string, enum: [started, finished] }
        outcome: { type: string, enum: [passed, failed, error], description: "required with finished: passed = the minimal order passed every replay" }
        runs: { type: integer, minimum: 0, maximum: 1000 }
        fails: { type: integer, minimum: 0, maximum: 1000 }
        fingerprint: { type: string, pattern: "^[0-9a-f]{32}$" }
        identicalFingerprint: { type: boolean }
        detail: { type: string, maxLength: 2000 }
        command: { type: string, maxLength: 4000 }
    Defect:
      type: object
      required: [id, projectId, projectName, testId, status, state, cause, causeTests, minimalOrder, prefixLength, seed, fingerprint, replays, outcome, exception,
        divergence, familyKey, firstSeenAt, lastSeenAt, firstRunId, lastRunId, occurrences, engineVersion, language, testRunner, replayCommand]
      properties:
        id: { type: string }
        projectId: { type: string }
        projectName: { type: string }
        testId: { type: string }
        status: { type: string, enum: [reproduced, replay_unstable, reported], description: "reported: the run's summary named it flaky (failed in the suite, passed alone) and no bundle has come yet" }
        state: { type: string, enum: [open, fixed, muted] }
        cause: { $ref: "#/components/schemas/DefectCause" }
        causeTests: { type: array, items: { type: string } }
        minimalOrder: { type: array, items: { type: string } }
        prefixLength: { type: integer }
        seed: { type: [integer, "null"] }
        fingerprint: { type: [string, "null"] }
        replays:
          type: object
          required: [runs, fails, identicalFingerprint]
          properties: { runs: { type: integer }, fails: { type: integer }, identicalFingerprint: { type: boolean } }
        outcome: { type: string }
        exception:
          type: object
          required: [type, phase, message, location]
          properties: { type: { type: string }, phase: { type: string }, message: { type: string }, location: { type: string } }
        divergence:
          oneOf:
            - type: object
              required: [index, reason, description]
              properties:
                index: { type: integer }
                reason: { type: string }
                description: { type: string }
                passing: { type: array, items: { $ref: "#/components/schemas/TraceEvent" }, description: "A passing run's events up to the divergent one (the last)" }
                failing: { type: array, items: { $ref: "#/components/schemas/TraceEvent" }, description: "The failing run's events up to the divergent one (the last)" }
            - { type: "null" }
        firstPullRequest: { type: [integer, "null"], description: "Proposed (P-049): the pull request of the run where it was first seen" }
        familyKey: { type: string }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        firstRunId: { type: [string, "null"] }
        lastRunId: { type: [string, "null"] }
        occurrences: { type: integer }
        engineVersion: { type: string }
        language: { type: string, enum: [python, node] }
        testRunner: { $ref: "#/components/schemas/TestRunner" }
        replayCommand:
          type: [string, "null"]
          description: "The replay command the runner sent with the bundle (e.g. the engine's own command); null: the dashboard builds it from the seed and the minimal order."
        stateReason: { type: [string, "null"] }
        stateChangedAt: { type: [string, "null"], format: date-time }
        bundle: { oneOf: [{ $ref: "#/components/schemas/DefectBundleInfo" }, { type: "null" }] }
        lastReplay: { oneOf: [{ $ref: "#/components/schemas/Replay" }, { type: "null" }] }
        pullCommand: { type: string, description: "fetches the bundle with an API key (curl and tar)" }
        culprit: { oneOf: [{ type: object, required: [summary], properties: { summary: { type: string }, url: { type: [string, "null"] } } }, { type: "null" }], description: "Passo 3's culprit verdict, when the engine delivers it" }
        dependencyVerdict: { oneOf: [{ type: object, required: [summary], properties: { summary: { type: string } } }, { type: "null" }], description: "Passo 3's dependency verdict, when the engine delivers it" }
    TraceEvent:
      type: object
      description: One event of the engine's trace (thread, source, operation, call site, value).
      required: [index, thread, source, op, site, value]
      properties:
        index: { type: integer }
        thread: { type: string }
        source: { type: string, description: "time, random, entropy, fs, net, env, sched, ..." }
        op: { type: string }
        site: { type: string, description: "path:line" }
        value: { type: string }
    DefectOccurrence:
      type: object
      description: "One sighting of the defect: a run (with its commit, branch and pull request), or an exploration (runId, runNumber null)."
      required: [runId, runNumber, commitSha, branch, pullRequest, at]
      properties:
        runId: { type: [string, "null"] }
        runNumber: { type: [integer, "null"] }
        commitSha: { type: [string, "null"] }
        branch: { type: [string, "null"] }
        pullRequest: { type: [integer, "null"] }
        at: { type: string, format: date-time }
        id: { type: string }
        source: { type: string, enum: [run, exploration] }
        explorationId: { type: [string, "null"] }
        fingerprint: { type: [string, "null"] }
        fingerprintChanged: { type: boolean, description: "the fingerprint differs from the defect's previous sighting" }
        divergence:
          oneOf:
            - { type: object, required: [index, reason, description], properties: { index: { type: integer }, reason: { type: string }, description: { type: string } } }
            - { type: "null" }
        seed: { type: [integer, "null"] }
        engineVersion: { type: string }
        status: { type: string, enum: [reproduced, replay_unstable, reported] }
    DefectBundleInfo:
      type: object
      required: [id, sha256, sizeBytes, receivedAt]
      properties: { id: { type: string }, sha256: { type: string }, sizeBytes: { type: integer }, receivedAt: { type: string, format: date-time } }
    DefectBundle:
      type: object
      required: [url, expiresAt, sha256, bytes]
      properties:
        url: { type: string, description: "Signed, short-lived" }
        expiresAt: { type: string, format: date-time }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        bytes: { type: integer }
    DefectFamily:
      type: object
      required: [key, projectId, projectName, cause, causeTests, defects]
      properties:
        key: { type: string }
        projectId: { type: string }
        projectName: { type: string }
        cause: { $ref: "#/components/schemas/DefectCause" }
        causeTests: { type: array, items: { type: string } }
        defects: { type: array, items: { $ref: "#/components/schemas/Defect" } }

    # ---------------------------------------------------------------- overview, trial, usage, billing
    GitHubRate:
      type: object
      required: [usdPerMinute, runner, source, checkedOn]
      properties: { usdPerMinute: { type: number }, runner: { type: string }, source: { type: string }, checkedOn: { type: string } }
    Plan:
      type: object
      required: [id, name, description, kind, unitsIncluded, maxProjects, priceUsdMonth, features, current]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [plan, addon] }
        unitsIncluded: { type: [integer, "null"], description: "Run units included each month; null: not set yet." }
        maxProjects: { type: [integer, "null"], description: "null: no limit." }
        priceUsdMonth: { type: [number, "null"], description: "null: the price is not set yet." }
        features: { type: array, items: { type: string } }
        current: { type: boolean, description: "The organization's plan, or an add-on it has." }
    DayPoint:
      type: object
      required: [at, value]
      properties: { at: { type: string, format: date-time }, value: { type: number } }
    Trial:
      type: object
      description: |
        The 30-day shadow trial: every test runs, the engine records what it would have skipped with proof. The gate
        is met when the would-have-saved skip share (time-weighted over the trial's finished runs) reaches 35%.
      required: [status, startedAt, endsAt, daysLeft, runs, wouldSkipShare, wouldSaveMinutes, units, gate]
      properties:
        status: { type: string, enum: [active, ended] }
        startedAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        daysLeft: { type: integer, minimum: 0 }
        runs: { type: integer, description: "Finished shadow runs." }
        wouldSkipShare: { type: [number, "null"], description: "null before the first finished shadow run." }
        wouldSaveMinutes: { type: number }
        units: { type: number, description: "Run units the trial's billable runs come to (not billed during the trial)." }
        gate:
          type: object
          required: [threshold, met]
          properties: { threshold: { type: number, enum: [0.35] }, met: { type: boolean } }
    Overview:
      type: object
      required: [month, trial, runs, minutesSaved, timeToGreen, skipShare, minutes, cost, units, projects, openDefects, recentDefects]
      properties:
        month: { $ref: "#/components/schemas/Month" }
        trial: { oneOf: [{ $ref: "#/components/schemas/Trial" }, { type: "null" }] }
        runs:
          type: object
          required: [thisMonth, lastMonthSameDays, perDay]
          properties: { thisMonth: { type: integer }, lastMonthSameDays: { type: integer }, perDay: { type: array, items: { $ref: "#/components/schemas/DayPoint" } } }
        minutesSaved:
          type: object
          required: [thisMonth, perDay]
          properties: { thisMonth: { type: number }, perDay: { type: array, items: { $ref: "#/components/schemas/DayPoint" } } }
        timeToGreen:
          type: object
          required: [beforeMedianS, withMedianS, commits]
          properties: { beforeMedianS: { type: [number, "null"] }, withMedianS: { type: [number, "null"] }, commits: { type: integer } }
        skipShare:
          type: object
          required: [median, perDay]
          properties: { median: { type: [number, "null"] }, perDay: { type: array, items: { $ref: "#/components/schemas/DayPoint" } } }
        minutes: { $ref: "#/components/schemas/MinuteBreakdown" }
        cost:
          type: object
          required: [githubEquivalentUsd, githubEquivalentMinutes, plan, rate]
          properties:
            githubEquivalentUsd: { type: number }
            githubEquivalentMinutes: { type: number }
            plan: { oneOf: [{ $ref: "#/components/schemas/Plan" }, { type: "null" }] }
            rate: { $ref: "#/components/schemas/GitHubRate" }
        units:
          type: object
          description: This month's run units (billable usage events only).
          required: [used, included]
          properties: { used: { type: number }, included: { type: [integer, "null"] } }
        projects: { type: array, items: { $ref: "#/components/schemas/ProjectRow" } }
        openDefects: { type: integer }
        recentDefects: { type: array, items: { $ref: "#/components/schemas/Defect" } }
    UsageTotals:
      type: object
      required: [runs, units, testMinutesRan, minutesSaved, otherStepMinutes, githubEquivalentMinutes, githubEquivalentUsd]
      properties:
        runs: { type: integer, description: "Billable runs." }
        units: { type: number, description: "Run units: billable baseline minutes / 10." }
        testMinutesRan: { type: number }
        minutesSaved: { type: number }
        otherStepMinutes: { type: number }
        githubEquivalentMinutes: { type: number }
        githubEquivalentUsd: { type: number }
    UsageProjectRow:
      allOf:
        - $ref: "#/components/schemas/UsageTotals"
        - type: object
          required: [projectId, fullName]
          properties: { projectId: { type: string }, fullName: { type: string } }
    UsageReport:
      type: object
      required: [month, plan, runsUsed, unitsUsed, unitsIncluded, totals, rows, daily, rate]
      properties:
        month: { $ref: "#/components/schemas/Month" }
        plan: { oneOf: [{ $ref: "#/components/schemas/Plan" }, { type: "null" }] }
        runsUsed: { type: integer, description: "Billable runs of the month." }
        unitsUsed: { type: number, description: "Run units of the month: the billable events' baseline minutes / 10, rounded up to a whole unit." }
        unitsIncluded: { type: [integer, "null"] }
        totals: { $ref: "#/components/schemas/UsageTotals" }
        rows: { type: array, items: { $ref: "#/components/schemas/UsageProjectRow" } }
        daily:
          type: object
          required: [days, series]
          properties:
            days: { type: array, items: { type: string } }
            series:
              type: array
              items: { type: object, required: [label, values], properties: { label: { type: string }, values: { type: array, items: { type: number } } } }
        rate: { $ref: "#/components/schemas/GitHubRate" }
    BillingOverview:
      type: object
      required: [currency, plan, addons, trial, period, runsUsed, unitsUsed, unitsIncluded, projects, averageMonthlyUnits, suggestedPlanId]
      properties:
        currency: { type: string }
        plan: { oneOf: [{ $ref: "#/components/schemas/Plan" }, { type: "null" }] }
        addons: { type: array, items: { $ref: "#/components/schemas/Plan" }, description: "Add-ons (kind addon); current = the organization has it." }
        trial: { oneOf: [{ $ref: "#/components/schemas/Trial" }, { type: "null" }] }
        period:
          type: object
          required: [start, end]
          properties: { start: { type: string, format: date-time }, end: { type: string, format: date-time } }
        runsUsed: { type: integer }
        unitsUsed: { type: number }
        unitsIncluded: { type: [integer, "null"] }
        projects: { type: integer }
        averageMonthlyUnits: { type: number, description: "Over the last three full months with usage, for sizing." }
        suggestedPlanId: { type: [string, "null"] }

    # ---------------------------------------------------------------- GitHub
    InstallationStatus: { type: string, enum: [active, suspended, deleted] }
    Installation:
      type: object
      required: [installationId, account, accountType, status, repositorySelection, linkedAt, repositories]
      properties:
        installationId: { type: integer }
        account: { type: string }
        accountType: { type: string, enum: [User, Organization, Enterprise] }
        status: { $ref: "#/components/schemas/InstallationStatus" }
        repositorySelection: { type: string, enum: [all, selected] }
        linkedAt: { type: [string, "null"], format: date-time }
        repositories: { type: integer, description: "Repositories it gives access to (not removed)." }
    GitHubConnection:
      type: object
      required: [account, installations]
      properties:
        account: { type: [string, "null"], description: "The account of the first active installation, or null when none." }
        installations: { type: array, items: { $ref: "#/components/schemas/Installation" } }
    OnboardingState:
      type: string
      enum: [pending, pr_open, merged, closed, no_workflow, no_test_job, already_fenvix, unsupported, failed]
      description: |
        pending: not tried yet; pr_open / merged / closed: the setup pull request; no_workflow: no workflow file;
        no_test_job: no job that runs tests; already_fenvix: already on runs-on fenvix; unsupported: a test runner fenvix
        does not support; failed: the App could not open the pull request (onboardingDetail says why).
    GitHubRepository:
      type: object
      required: [repositoryId, installationId, fullName, private, removed, language, testRunner, onboardingState, onboardingDetail, workflowPath, job, setupPullRequest, projectId, warmCache]
      properties:
        repositoryId: { type: integer }
        installationId: { type: integer }
        fullName: { type: string }
        private: { type: boolean }
        removed: { type: boolean, description: "No longer given by its installation." }
        language: { oneOf: [{ $ref: "#/components/schemas/Language" }, { type: "null" }] }
        testRunner: { oneOf: [{ $ref: "#/components/schemas/TestRunner" }, { type: "null" }] }
        onboardingState: { $ref: "#/components/schemas/OnboardingState" }
        onboardingDetail: { type: string }
        workflowPath: { type: [string, "null"] }
        job: { type: [string, "null"] }
        setupPullRequest: { oneOf: [{ $ref: "#/components/schemas/SetupPullRequest" }, { type: "null" }] }
        projectId: { type: [string, "null"] }
        warmCache: { $ref: "#/components/schemas/WarmCache" }
    SetupChange:
      type: object
      required: [path, job, before, after]
      properties: { path: { type: string }, job: { type: string }, before: { type: string }, after: { type: string } }

    # ---------------------------------------------------------------- what fenvix machines send
    RunnerJob:
      type: object
      description: Which job (the credential names the runner and repository; per-job credentials also the run).
      required: [runId]
      properties:
        runId: { type: integer, minimum: 1, description: "GitHub's workflow run id (GITHUB_RUN_ID)" }
        runAttempt: { type: integer, minimum: 1, default: 1 }
        repositoryId: { type: integer, description: "Must match the credential when given" }
        runnerName: { type: string, description: "Must match the credential when given" }
    RunnerSummaryEnvelope:
      allOf:
        - $ref: "#/components/schemas/RunnerJob"
        - type: object
          required: [summary]
          properties:
            receiptsUrl: { type: [string, "null"] }
            summary: { type: object, description: "runner/fenvix-run summary.json (docs/data-contract.md)" }
    RunnerProgress:
      allOf:
        - $ref: "#/components/schemas/RunnerJob"
        - type: object
          required: [seq, phase, testsDone, passed, failed, skippedWithProof, elapsedMs]
          properties:
            seq: { type: integer, minimum: 0, description: "Increases with every record of the job" }
            phase: { type: string, enum: [setup, collecting, testing, reporting] }
            testsTotal: { type: [integer, "null"], minimum: 0 }
            testsDone: { type: integer, minimum: 0 }
            passed: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
            skippedWithProof: { type: integer, minimum: 0 }
            currentTest: { type: [string, "null"], maxLength: 2000 }
            elapsedMs: { type: integer, minimum: 0 }
            mode: { $ref: "#/components/schemas/RunMode" }
            finished:
              type: array
              maxItems: 500
              description: "The tests finished since the previous progress record (the live view); a test sent twice keeps the first. The results chunks stay authoritative."
              items: { $ref: "#/components/schemas/RunnerTestOutcome" }
            workers:
              type: array
              maxItems: 256
              items:
                type: object
                required: [id]
                properties:
                  id: { type: string, maxLength: 100 }
                  currentTest: { type: [string, "null"], maxLength: 2000 }
                  testsDone: { type: integer, minimum: 0 }
                  state: { type: string, enum: [running, idle, done] }
    RunnerTestOutcome:
      type: object
      required: [testId, outcome, durationMs]
      properties:
        testId: { type: string, maxLength: 2000 }
        outcome: { $ref: "#/components/schemas/TestOutcome" }
        durationMs: { type: integer, minimum: 0 }
        failure:
          oneOf:
            - type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [real, flaky_defect] }
                phase: { type: string }
                exceptionType: { type: string }
                message: { type: string, maxLength: 4000 }
                location: { type: string }
                defectFingerprint: { type: string, pattern: "^[0-9a-f]{32}$", description: "The defect bundle of this failure, when it is flaky" }
            - { type: "null" }
        cacheKey: { type: [string, "null"], pattern: "^[0-9a-f]{32}$", description: "skipped_with_proof: the receipt's key" }
        wouldSkip: { type: boolean, description: "Shadow mode: the engine would have skipped it" }
        worker: { type: [string, "null"], maxLength: 100, description: "The worker that ran it (e.g. gw0); null for a serial run" }
        finishedAt: { type: string, format: date-time }
        output: { type: string, maxLength: 65536, description: "The test's captured output (stdout, stderr, log), at most 64 KB: the coding agent's get_test_log" }
    RunnerReceipt:
      type: object
      description: One reused test's receipt (receipts.jsonl line plus the lists from proof-cache.json).
      required: [testId, cacheKey, reusedEngineRunId, fingerprint, reusedDurationMs]
      properties:
        testId: { type: string, maxLength: 2000 }
        cacheKey: { type: string, pattern: "^[0-9a-f]{32}$" }
        reusedEngineRunId: { type: string, maxLength: 100 }
        fingerprint: { type: string, pattern: "^[0-9a-f]{32}$" }
        reusedDurationMs: { type: integer, minimum: 0 }
        code: { type: array, items: { type: object, required: [path, qualname, digest], properties: { path: { type: string }, qualname: { type: string }, digest: { type: string } } } }
        modules: { type: array, items: { type: object, required: [path, kind, digest], properties: { path: { type: string }, kind: { type: string, enum: [content, skeleton, hooks] }, digest: { type: string } } } }
        filesRead: { type: array, items: { type: object, required: [path, dep], properties: { path: { type: string }, dep: { type: string } } } }
        envRead: { type: array, items: { type: object, required: [name, digest], properties: { name: { type: string }, digest: { type: string } } } }
        runtime: { type: object }
        config: { type: object }
        changedFilesProven: { type: integer, minimum: 0 }
    RunnerDefect:
      type: object
      description: One defect bundle (bundle.json) and the engine's own replay command.
      required: [testId, status, kind, order, fingerprint, replay, exception]
      properties:
        testId: { type: string, maxLength: 2000 }
        status: { type: string, enum: [reproduced, replay_unstable] }
        kind:
          type: string
          enum: [order, brittle, fails-alone, async-order, thread, clock, random, network, fs, env]
          description: "order dependence (order, brittle, fails-alone) or the kind of the first divergent event (async-order, thread, clock, random, network, fs, env)"
        polluters: { type: array, items: { type: string } }
        setters: { type: array, items: { type: string } }
        order: { type: array, minItems: 1, items: { type: string } }
        prefixLength: { type: integer, minimum: 0 }
        seed: { type: [integer, "null"] }
        fingerprint: { type: string, pattern: "^[0-9a-f]{32}$" }
        replay:
          type: object
          required: [runs, fails, identicalFingerprint]
          properties: { runs: { type: integer }, fails: { type: integer }, identicalFingerprint: { type: boolean } }
        outcome: { type: string }
        exception:
          type: object
          required: [type, phase, message, location]
          properties: { type: { type: string }, phase: { type: string }, message: { type: string, maxLength: 4000 }, location: { type: string } }
        divergence:
          oneOf:
            - type: object
              required: [index, reason, description]
              properties:
                index: { type: integer }
                reason: { type: string }
                description: { type: string }
                passing: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/TraceEvent" }, description: "a passing run's events up to the divergent one" }
                failing: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/TraceEvent" }, description: "the failing run's events up to the divergent one" }
            - { type: "null" }
        engineVersion: { type: string }
        language: { type: string, enum: [python, node] }
        replayCommand: { type: string, maxLength: 4000, description: "The bundle's command, e.g. pytest --det --det-seed=3 --det-order=<bundle>/order.txt -n 0" }
    RunnerAuditRerun:
      type: object
      required: [testId, cacheKey, outcome]
      properties:
        testId: { type: string, maxLength: 2000 }
        cacheKey: { type: string, pattern: "^[0-9a-f]{32}$" }
        outcome: { type: string, enum: [confirmed, wrong_skip] }
        untrusted: { type: boolean, default: false }
        detail: { type: string, maxLength: 2000 }
    RunnerResults:
      allOf:
        - $ref: "#/components/schemas/RunnerJob"
        - type: object
          required: [chunk]
          properties:
            chunk: { type: integer, minimum: 0, maximum: 9999 }
            chunks: { type: integer, minimum: 1, maximum: 10000, description: "Chunk 0 only: how many chunks in all" }
            engineRunId: { type: string, maxLength: 100 }
            seed: { type: [integer, "null"] }
            mode: { $ref: "#/components/schemas/RunMode" }
            tests: { type: array, maxItems: 5000, items: { $ref: "#/components/schemas/RunnerTestOutcome" } }
            receipts: { type: array, maxItems: 2000, items: { $ref: "#/components/schemas/RunnerReceipt" } }
            defects: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/RunnerDefect" } }
            audit: { type: array, maxItems: 5000, items: { $ref: "#/components/schemas/RunnerAuditRerun" } }
            missDetails: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/MissDetail" } }
    RunnerWarmupReport:
      type: object
      description: |
        A warm-up machine's report. The credential names the warm-up, the repository and the runner name; `warmupId`
        (and `repositoryId` / `runnerName` when given) must match it. `outcome` is sent with `finished` only:
        succeeded (the test step ran and the cache was written; send `summary`), failed (the job or its tests failed:
        `detail` says where), unsupported (the job cannot run outside GitHub Actions, e.g. it needs another job's
        outputs or a service container the runner does not support: `detail` says which).
      required: [warmupId, event]
      properties:
        warmupId: { type: integer, minimum: 1 }
        event: { type: string, enum: [started, finished] }
        outcome: { type: string, enum: [succeeded, failed, unsupported] }
        detail: { type: string, maxLength: 1000 }
        summary: { type: object, description: "runner/fenvix-run summary.json, as for POST /runner/summaries" }
        repositoryId: { type: integer, description: "Must match the credential when given" }
        runnerName: { type: string, description: "Must match the credential when given" }
      if: { properties: { event: { const: finished } }, required: [event] }
      then: { properties: { outcome: { type: string } }, required: [outcome] }
      else: { properties: { outcome: false, summary: false } }
    RunnerExploration:
      type: object
      required: [startedAt, finishedAt, commitSha, branch, seeds, runs, collected, seconds]
      properties:
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        commitSha: { type: string, pattern: "^[0-9a-f]{40}$" }
        branch: { type: string }
        seeds: { type: integer, minimum: 0 }
        runs: { type: integer, minimum: 0 }
        collected: { type: integer, minimum: 0 }
        seconds: { type: number, minimum: 0 }
        flakyFailing: { type: array, items: { type: string } }
        alwaysFailing: { type: array, items: { type: string } }
        notReproduced: { type: array, items: { type: string } }
        familiesByPolluter: { type: object, additionalProperties: { type: array, items: { type: string } } }
        seedsLog: { type: array, items: { type: object, required: [seed, seconds, failing], properties: { seed: { type: integer }, seconds: { type: number }, failing: { type: array, items: { type: string } } } } }
        defects: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/RunnerDefect" } }
