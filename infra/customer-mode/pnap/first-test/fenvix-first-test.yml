# Copy into .github/workflows/ of each test repository (two GitHub organizations, docs/CUSTOMER-MODE-PNAP.md).
# first-test.sh dispatches it. Runs on fenvix (a Firecracker microVM on a phoenixNAP host) and checks, from inside the
# job, what the job must and must not reach; the job fails if any check fails.
name: fenvix-first-test
on:
  workflow_dispatch:
    inputs:
      nonce:
        description: "set by first-test.sh"
        required: true
jobs:
  isolation:
    runs-on: fenvix
    timeout-minutes: 20
    steps:
      - name: probes
        shell: bash
        run: |
          set -uo pipefail
          echo "FENVIX-TIME job_start $(date +%s.%N) nonce ${{ inputs.nonce }}"
          # probe.sh is inlined by first-test.sh --print-workflow (fenvix-app is private: nothing is downloaded), and
          # checked against the SHA-256 it had when the workflow was printed.
          cat >probe.sh <<'FENVIX_PROBE'
__PROBE_SH__
          FENVIX_PROBE
          echo "${PROBE_SHA256}  probe.sh" | sha256sum -c -
          bash probe.sh
        env:
          PROBE_SHA256: __PROBE_SHA256__
